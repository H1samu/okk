<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Журналы</title>
<script src="auth-guard.js"></script>
<script src="favorites.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;
    --surface:#ffffff;
    --border:#e4e2d9;
    --border-strong:#c9c6b8;
    --text:#20201c;
    --text-secondary:#6b6a61;
    --text-muted:#98968a;
    --accent:#3a5a52;
    --accent-soft:#e8efec;
    --danger:#9c3b34;
    --danger-soft:#fbebe9;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:32px 20px 60px;
  }
  header{
    text-align:center;
    margin-bottom:28px;
  }
  header .eyebrow{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    font-weight:600;
    margin-bottom:8px;
  }
  header .logo{
    height:48px;
    width:auto;
    margin-bottom:14px;
  }
  h1{
    font-size:26px;
    font-weight:700;
    margin:0 0 6px;
  }
  header p{
    font-size:14px;
    color:var(--text-secondary);
    margin:0;
  }
  .inline-refresh{
    background:none;
    border:none;
    padding:0;
    margin:0;
    font:inherit;
    color:inherit;
    cursor:text;
    text-decoration:none;
  }
  header .total-count{
    font-size:13px;
    color:var(--text-muted);
    margin-top:10px;
  }
  .search-box{
    position:relative;
    max-width:520px;
    margin:24px auto 0;
  }
  .search-row{
    display:flex;
    align-items:center;
    gap:8px;
    max-width:520px;
    margin:24px auto 0;
  }
  .search-row .search-box{
    margin:0;
    flex:1;
  }
  .search-box input{
    width:100%;
    padding:13px 16px 13px 42px;
    border:1px solid var(--border-strong);
    border-radius:999px;
    font-size:15px;
    font-family:inherit;
    background:var(--surface);
    color:var(--text);
  }
  .search-box input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .search-box svg{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    stroke:var(--text-muted);
  }
  .scan-btn{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:46px;
    padding:0 16px;
    border-radius:999px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .scan-btn:hover{border-color:var(--accent);}
  .scan-modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .scan-modal-overlay.show{display:flex;}
  .scan-modal{
    background:var(--surface);
    border-radius:var(--radius);
    max-width:420px;
    width:100%;
    padding:20px;
  }
  .scan-modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .scan-modal-header h3{
    font-size:15px;
    font-weight:700;
    margin:0;
  }
  .scan-close{
    background:none;
    border:none;
    font-size:20px;
    color:var(--text-muted);
    cursor:pointer;
    line-height:1;
    padding:4px;
  }
  .scan-video-wrap{
    position:relative;
    border-radius:10px;
    overflow:hidden;
    background:#000;
    aspect-ratio:1/1;
  }
  .scan-video-wrap video{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .scan-frame{
    position:absolute;
    inset:14%;
    border:2px solid #ffffff;
    border-radius:12px;
    opacity:0.85;
    pointer-events:none;
  }
  .scan-status{
    margin-top:12px;
    font-size:13px;
    color:var(--text-secondary);
    text-align:center;
    min-height:18px;
  }
  .scan-status.error{color:var(--danger);}
  .tags-section{margin-top:36px;}
  .quick-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:24px;
  }
  .master-link{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fdf3e3;
    border:1px solid #ecd9ab;
    border-radius:var(--radius);
    padding:14px 16px;
    text-decoration:none;
  }
  .master-link:hover{border-color:#dcbf7e;}
  .master-link .ml-icon{font-size:17px; flex-shrink:0;}
  .master-link .ml-text{
    font-size:13px;
    font-weight:600;
    color:#8a6416;
  }
  .fav-toggle{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    font-family:inherit;
    cursor:pointer;
    text-align:left;
  }
  .fav-toggle:hover{border-color:var(--border-strong);}
  .fav-toggle.active{
    background:#fdf7e3;
    border-color:#ecdca0;
  }
  .fav-toggle .ft-icon{font-size:17px; flex-shrink:0;}
  .fav-toggle .ft-text{
    font-size:13px;
    font-weight:600;
    color:var(--text);
  }
  .tags-section h2{
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--text-muted);
    margin:0 0 12px;
  }
  .tag-grid{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tag-grid::-webkit-scrollbar{display:none;}
  .tag-card{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:9px 14px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
    transition:border-color .15s ease, transform .1s ease;
  }
  .tag-card:hover{border-color:var(--border-strong);}
  .tag-card:active{transform:scale(0.97);}
  .tag-card.active{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .tag-card .tag-name{
    font-size:13px;
    font-weight:600;
    color:var(--text);
  }
  .tag-card .tag-count{
    font-size:12px;
    color:var(--text-muted);
  }
  .tag-card.active .tag-count{color:var(--accent);}
  .results-section{margin-top:36px;}
  .results-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .results-header h2{
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--text-muted);
    margin:0;
  }
  .reset-btn{
    font-size:12px;
    color:var(--accent);
    background:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
    display:none;
    padding:0;
  }
  .reset-btn.show{display:inline;}
  .journal-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .journal-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px 16px;
    text-decoration:none;
    color:var(--text);
  }
  .journal-row:hover{border-color:var(--border-strong);}
  .journal-row .jr-left{
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:0;
  }
  .journal-row .jr-name{
    font-size:14px;
    font-weight:500;
  }
  .journal-row .jr-name mark{
    background:#fde68a;
    color:inherit;
    border-radius:3px;
  }
  .journal-row .jr-tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .journal-row .jr-tags span{
    font-size:11px;
    color:var(--text-muted);
    background:var(--bg);
    border-radius:999px;
    padding:2px 8px;
  }
  .journal-row .jr-arrow{
    flex-shrink:0;
    color:var(--text-muted);
    font-size:16px;
  }
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text-muted);
    font-size:14px;
  }
  .loading-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text-muted);
    font-size:14px;
  }
  .site-footer{
    text-align:center;
    margin-top:40px;
    font-size:12px;
    color:var(--text-muted);
    opacity:0.6;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <img class="logo" src="logo.png" alt="G-check">
    <h1>Журналы и чек-листы НАССР</h1>
    <p>Найдите нужный документ по тегу <button id="refreshBtn" class="inline-refresh" type="button">или</button> через поиск</p>

    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск журнала" autocomplete="off">
      </div>
      <button class="scan-btn" id="scanBtn" type="button">📷 QR</button>
    </div>
    <div class="total-count" id="totalCount"></div>

  </header>

  <div class="scan-modal-overlay" id="scanOverlay">
    <div class="scan-modal">
      <div class="scan-modal-header">
        <h3>Сканирование QR-кода</h3>
        <button class="scan-close" id="scanClose" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div class="scan-video-wrap">
        <video id="scanVideo" playsinline muted></video>
        <div class="scan-frame"></div>
      </div>
      <div class="scan-status" id="scanStatus">Наведите камеру на QR-код</div>
    </div>
  </div>

  <div class="quick-row">
    <a class="master-link" href="master.html">
      <span class="ml-icon">📊</span>
      <span class="ml-text">Мастер-таблица</span>
    </a>

    <button class="fav-toggle" id="favToggle" type="button">
      <span class="ft-icon">⭐</span>
      <span class="ft-text" id="favText">Избранное</span>
    </button>
  </div>

  <div class="tags-section">
    <h2>Теги</h2>
    <div class="tag-grid" id="tagGrid"></div>
  </div>

  <div class="results-section">
    <div class="results-header">
      <h2 id="resultsTitle">Все документы</h2>
      <button class="reset-btn" id="resetBtn">Сбросить фильтр</button>
    </div>
    <div class="journal-list" id="journalList">
      <div class="loading-state">Загрузка...</div>
    </div>
  </div>

  <div class="site-footer">by <a href="https://t.me/hisamost" onclick="return openExternal(this.href)" rel="noopener" style="color:inherit; text-decoration:none;">hisamost</a> &amp; <a href="https://t.me/katekateem" onclick="return openExternal(this.href)" rel="noopener" style="color:inherit; text-decoration:none;">katekateem</a></div>

</div>

<script>
  // Надёжное открытие внешних ссылок (Telegram и т.п.) — на части мобильных
  // браузеров и в установленном PWA обычный target="_blank" иногда "теряется".
  // Пробуем открыть новой вкладкой, если не получилось — переходим в текущей.
  function openExternal(url){
    const win = window.open(url, '_blank');
    if(!win){
      window.location.href = url;
    }
    return false;
  }

  // "Мягкое" обновление: чистит только кэш service worker'а (старые версии
  // файлов сайта), не трогает localStorage — авторизация и избранное остаются.
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.addEventListener('click', async () => {
    refreshBtn.disabled = true;
    refreshBtn.textContent = 'обновляем...';
    try{
      if('caches' in window){
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if('serviceWorker' in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      refreshBtn.textContent = 'готово ✓';
      setTimeout(() => window.location.reload(), 500);
    } catch(e){
      refreshBtn.textContent = 'или';
      refreshBtn.disabled = false;
    }
  });

  const TAG_ORDER = ["Санитария","АХО","Оборудование","Продукт","Включения","Температурные","Вредители","Учет","Прочее"];

  let journals = [];
  let activeTags = new Set();
  let favoritesOnly = false;

  const tagGrid = document.getElementById('tagGrid');
  const journalList = document.getElementById('journalList');
  const searchInput = document.getElementById('searchInput');
  const resetBtn = document.getElementById('resetBtn');
  const resultsTitle = document.getElementById('resultsTitle');
  const favToggle = document.getElementById('favToggle');
  const favText = document.getElementById('favText');

  fetch('journals.json')
    .then(r => {
      if(!r.ok) throw new Error('network');
      return r.json();
    })
    .then(data => {
      journals = data;
      document.getElementById('totalCount').textContent = ``;
      renderTags();
      renderList();
    })
    .catch(() => {
      journalList.innerHTML = '<div class="empty-state">Не удалось загрузить journals.json. Проверьте, что файл лежит рядом с index.html.</div>';
    });

  function renderTags(){
    const counts = {};
    TAG_ORDER.forEach(t => counts[t] = 0);
    journals.forEach(j => j.tags.forEach(t => { if(counts[t] !== undefined) counts[t]++; }));

    tagGrid.innerHTML = '';
    TAG_ORDER.forEach(tag => {
      const btn = document.createElement('button');
      btn.className = 'tag-card' + (activeTags.has(tag) ? ' active' : '');
      btn.setAttribute('aria-pressed', activeTags.has(tag) ? 'true' : 'false');
      btn.innerHTML = `<span class="tag-name">${activeTags.has(tag) ? '✓ ' : ''}${tag}</span><span class="tag-count">(${counts[tag]})</span>`;
      btn.addEventListener('click', () => {
        if(activeTags.has(tag)) activeTags.delete(tag);
        else activeTags.add(tag);
        renderTags();
        renderList();
      });
      tagGrid.appendChild(btn);
    });
  }

  function highlight(text, query){
    if(!query) return text;
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if(idx === -1) return text;
    return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + query.length) + '</mark>' + text.slice(idx + query.length);
  }

  function renderList(){
    const query = searchInput.value.trim();
    let filtered = journals;

    if(favoritesOnly){
      filtered = filtered.filter(j => isFavorite(j.id));
    }
    if(activeTags.size > 0){
      filtered = filtered.filter(j => Array.from(activeTags).every(t => j.tags.includes(t)));
    }
    if(query){
      filtered = filtered.filter(j => j.name.toLowerCase().includes(query.toLowerCase()));
    }

    resetBtn.classList.toggle('show', activeTags.size > 0 || !!query || favoritesOnly);

    if(favoritesOnly){
      resultsTitle.textContent = `⭐ Избранные формы (${filtered.length})`;
    } else {
      resultsTitle.textContent = activeTags.size > 0
        ? `${Array.from(activeTags).join(' + ')} (${filtered.length})`
        : `Все документы (${filtered.length})`;
    }

    if(filtered.length === 0){
      journalList.innerHTML = favoritesOnly
        ? '<div class="empty-state">Пока нет избранных форм. Отметьте нужные звёздочкой в мастер-таблице.</div>'
        : '<div class="empty-state">Ничего не найдено. Попробуйте другой запрос или тег.</div>';
      return;
    }

    // В режиме избранного цель — быстро заполнить форму, поэтому ссылка
    // ведёт сразу на саму форму (в новой вкладке), а не на просмотр журнала.
    journalList.innerHTML = filtered.map(j => {
      const href = favoritesOnly && j.formUrl ? j.formUrl : `journal.html?id=${encodeURIComponent(j.id)}`;
      const target = favoritesOnly && j.formUrl ? ' target="_blank" rel="noopener"' : '';
      return `
      <a class="journal-row" href="${href}"${target}>
        <div class="jr-left">
          <div class="jr-name">${highlight(j.name, query)}</div>
          <div class="jr-tags">${j.tags.map(t => `<span>${t}</span>`).join('')}</div>
        </div>
        <div class="jr-arrow">→</div>
      </a>
    `;
    }).join('');
  }

  favToggle.addEventListener('click', () => {
    favoritesOnly = !favoritesOnly;
    favToggle.classList.toggle('active', favoritesOnly);
    favText.textContent = favoritesOnly ? '✓ Избранное' : 'Избранное';
    renderList();
  });

  searchInput.addEventListener('input', renderList);
  resetBtn.addEventListener('click', () => {
    activeTags.clear();
    searchInput.value = '';
    favoritesOnly = false;
    favToggle.classList.remove('active');
    favText.textContent = 'Избранное';
    renderTags();
    renderList();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // --- Сканирование QR-кода ---
  const scanBtn = document.getElementById('scanBtn');
  const scanOverlay = document.getElementById('scanOverlay');
  const scanClose = document.getElementById('scanClose');
  const scanVideo = document.getElementById('scanVideo');
  const scanStatus = document.getElementById('scanStatus');

  let scanStream = null;
  let scanRAF = null;
  let scanCanvas = null;
  let scanCtx = null;
  let jsQRLoaded = false;
  let barcodeDetector = null;

  scanBtn.addEventListener('click', openScanner);
  scanClose.addEventListener('click', closeScanner);
  scanOverlay.addEventListener('click', (e) => { if(e.target === scanOverlay) closeScanner(); });

  async function openScanner(){
    scanOverlay.classList.add('show');
    scanStatus.textContent = 'Запрашиваем доступ к камере...';
    scanStatus.classList.remove('error');

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      scanStatus.textContent = 'Камера не поддерживается в этом браузере.';
      scanStatus.classList.add('error');
      return;
    }

    try{
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
    } catch(e){
      scanStatus.textContent = 'Нет доступа к камере. Разрешите доступ в настройках браузера.';
      scanStatus.classList.add('error');
      return;
    }

    scanVideo.srcObject = scanStream;
    await scanVideo.play();
    scanStatus.textContent = 'Наведите камеру на QR-код';

    if('BarcodeDetector' in window){
      try{
        barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
        scanLoopNative();
        return;
      } catch(e){
        barcodeDetector = null;
      }
    }

    if(!jsQRLoaded){
      await loadJsQR();
    }
    scanLoopFallback();
  }

  function closeScanner(){
    scanOverlay.classList.remove('show');
    if(scanRAF) cancelAnimationFrame(scanRAF);
    scanRAF = null;
    if(scanStream){
      scanStream.getTracks().forEach(t => t.stop());
      scanStream = null;
    }
    scanVideo.srcObject = null;
  }

  async function scanLoopNative(){
    if(!scanStream) return;
    try{
      const codes = await barcodeDetector.detect(scanVideo);
      if(codes.length > 0){
        handleScanResult(codes[0].rawValue);
        return;
      }
    } catch(e){ /* игнорируем единичные сбои кадра */ }
    scanRAF = requestAnimationFrame(scanLoopNative);
  }

  function scanLoopFallback(){
    if(!scanStream) return;
    if(!scanCanvas){
      scanCanvas = document.createElement('canvas');
      scanCtx = scanCanvas.getContext('2d');
    }
    if(scanVideo.readyState === scanVideo.HAVE_ENOUGH_DATA && window.jsQR){
      scanCanvas.width = scanVideo.videoWidth;
      scanCanvas.height = scanVideo.videoHeight;
      scanCtx.drawImage(scanVideo, 0, 0, scanCanvas.width, scanCanvas.height);
      const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
      const code = window.jsQR(imageData.data, imageData.width, imageData.height);
      if(code && code.data){
        handleScanResult(code.data);
        return;
      }
    }
    scanRAF = requestAnimationFrame(scanLoopFallback);
  }

  function loadJsQR(){
    return new Promise((resolve) => {
      if(window.jsQR){ jsQRLoaded = true; resolve(); return; }
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
      script.onload = () => { jsQRLoaded = true; resolve(); };
      script.onerror = () => {
        scanStatus.textContent = 'Не удалось загрузить сканер. Проверьте интернет-соединение.';
        scanStatus.classList.add('error');
        resolve();
      };
      document.head.appendChild(script);
    });
  }

  function handleScanResult(rawValue){
    if(scanRAF) cancelAnimationFrame(scanRAF);
    scanRAF = null;

    scanStatus.textContent = 'Код распознан, переходим по ссылке...';
    window.location.href = rawValue;
  }
</script>

</body>
</html>
