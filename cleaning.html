<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чек-лист уборки и проветривания — Hismar Check</title>
<script src="auth-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--surface:#fff;--border:#e4e2d9;--border-strong:#c9c6b8;--text:#20201c;--secondary:#6b6a61;--muted:#98968a;--accent:#3a5a52;--soft:#e8efec;--danger:#9c3b34;--danger-soft:#fbebe9;--radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 50px}.back{display:inline-flex;margin-bottom:20px;color:var(--secondary);text-decoration:none;font-size:13px}.back:hover{color:var(--accent)}
header{margin-bottom:20px}h1{font-size:22px;line-height:1.3;margin:0 0 6px;font-weight:700}.subtitle{font-size:13px;color:var(--secondary);margin:0}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:150px}.field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
select,input[type=date]{height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:9px;background:#fff;color:var(--text);font:500 13px Manrope,Arial,sans-serif}
select{min-width:190px}.field.period{min-width:140px}.reset{height:40px;padding:0 14px;border:1px solid var(--border-strong);border-radius:9px;background:#fff;color:var(--accent);font:600 13px Manrope,Arial,sans-serif;cursor:pointer}.reset:hover{border-color:var(--accent)}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 2px;font-size:12px;color:var(--muted)}
.state{padding:42px 20px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:14px;color:var(--muted)}.state.error{color:var(--danger);background:var(--danger-soft);border-color:transparent}
.table-wrap{overflow:auto;max-height:70vh;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;min-width:850px;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;z-index:4;background:var(--soft);color:var(--text);text-align:left;padding:11px 13px;font-weight:700;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap}
thead th.group{text-align:center}
tbody td{padding:10px 13px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);color:var(--secondary);white-space:nowrap}
tbody tr:hover td{background:#fbfaf7}td.date,td.kind,td.person{color:var(--text)}td.date,td.kind{font-weight:600}
td.date,td.person{vertical-align:middle}
td.time-merged{text-align:center;vertical-align:middle;font-weight:400;color:var(--secondary)}
@media(max-width:600px){.wrap{padding:18px 12px 36px}h1{font-size:20px}.toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}.toolbar .field:first-child{grid-column:1/-1}.toolbar .field,.toolbar .field.period{min-width:0;width:100%}.field select,.field input{width:100%;min-width:0}.reset{grid-column:1/-1;width:100%}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← Все журналы</a>
<header><h1>НАССР-К-02 Чек-лист уборки и проветривания помещений</h1><p class="subtitle">Отметки по видам уборки и времени выполнения</p></header>
<section class="toolbar" aria-label="Фильтры">
  <div class="field"><label for="monthFilter">Месяц</label><select id="monthFilter"><option value="">Все месяцы</option></select></div>
  <div class="field period"><label for="dateFrom">Период с</label><input id="dateFrom" type="date"></div>
  <div class="field period"><label for="dateTo">Период по</label><input id="dateTo" type="date"></div>
  <button class="reset" id="resetFilters" type="button">Сбросить фильтры</button>
</section>
<div class="meta"><span id="rowCount">Загрузка записей…</span><span id="updated"></span></div>
<div id="content"><div class="state">Загрузка данных таблицы…</div></div>
</div>
<script>
(function(){
'use strict';
const journalId = 'НАССР-К-02';
function hasJournalAccess(){
  const a = window.gcheckUser?.allowed;
  return a === '*' || (Array.isArray(a) && a.includes(journalId));
}
if(!window.gcheckUser) return; // auth-guard.js перенаправляет на вход
if(!hasJournalAccess()){ location.replace('index.html'); return; }
document.addEventListener('gcheck:user', () => {
  if(!hasJournalAccess()) location.replace('index.html');
});
const SPREADSHEET_ID='1jydKAjIdJh5ilupdT2FNHSHlEizT70rCXbUHzNEgBpE';
const SHEET_RANGE="'Текущий месяц'!A1:F";
const API_KEY='AIzaSyCrXcA6Rzohxe0bWBD3W8veWLprb47m2lY';
const monthFilter=document.getElementById('monthFilter'),dateFrom=document.getElementById('dateFrom'),dateTo=document.getElementById('dateTo');
const content=document.getElementById('content'),rowCount=document.getElementById('rowCount'),updated=document.getElementById('updated');
let records=[];
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function parseDate(v){
 const s=String(v??'').trim();let m=s.match(/^(\d{1,2})[-.](\d{1,2})[-.](\d{4})$/);
 if(m)return new Date(+m[3],+m[2]-1,+m[1]);
 m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);
 return null;
}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function fmt(d){return d.toLocaleDateString('ru-RU')}
function init(values){
 let currentDate=null,currentPerson='';
 records=[];
 values.slice(1).forEach(r=>{
   const parsed=parseDate(r[0]);
   if(parsed)currentDate=parsed;
   if(r[5])currentPerson=r[5];
   if(!currentDate||!r[1])return;
   records.push({date:currentDate,dateText:fmt(currentDate),kind:r[1],t0800:r[2]||'',t1300:r[3]||'',t1800:r[4]||'',person:currentPerson});
 });
 // Сохраняем порядок типов уборки внутри дня, но показываем более новые даты первыми.
 const grouped=new Map();
 records.forEach(r=>{
   const k=key(r.date)+'-'+r.date.getDate();
   if(!grouped.has(k))grouped.set(k,{date:r.date,dateText:r.dateText,person:r.person,items:[]});
   grouped.get(k).items.push(r);
 });
 records=[...grouped.values()].sort((a,b)=>b.date-a.date);
 const months=[...new Set(records.map(g=>key(g.date)))].sort().reverse();
 monthFilter.innerHTML='<option value="">Все месяцы</option>'+months.map(m=>{const [y,mo]=m.split('-');const label=new Date(+y,+mo-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});return '<option value="'+m+'">'+esc(label.charAt(0).toUpperCase()+label.slice(1))+'</option>'}).join('');
 const total=records.reduce((n,g)=>n+g.items.length,0);
 rowCount.textContent='Всего записей: '+total;
 updated.textContent=records.length?'Последняя дата: '+fmt(records[0].date):'';
 draw();
}
function draw(){
 const from=dateFrom.value?new Date(dateFrom.value+'T00:00:00'):null;
 const to=dateTo.value?new Date(dateTo.value+'T23:59:59'):null;
 const groups=records.filter(g=>(!monthFilter.value||key(g.date)===monthFilter.value)&&(!from||g.date>=from)&&(!to||g.date<=to));
 const count=groups.reduce((n,g)=>n+g.items.length,0);
 const total=records.reduce((n,g)=>n+g.items.length,0);
 rowCount.textContent='Показано: '+count+' из '+total;
 if(!groups.length){content.innerHTML='<div class="state">За выбранный период записей нет.</div>';return}
 const body=groups.map(g=>g.items.map((r,i)=>{
   const cells=[];
   if(i===0)cells.push('<td class="date" rowspan="'+g.items.length+'">'+esc(g.dateText)+'</td>');
   cells.push('<td class="kind">'+esc(r.kind)+'</td>');
   if(r.kind.trim().toLowerCase()==='влажная уборка'){
     cells.push('<td class="time-merged" colspan="3">'+esc(r.t0800||'08:00')+'</td>');
   }else{
     cells.push('<td>'+esc(r.t0800)+'</td><td>'+esc(r.t1300)+'</td><td>'+esc(r.t1800)+'</td>');
   }
   if(i===0)cells.push('<td class="person" rowspan="'+g.items.length+'">'+esc(g.person)+'</td>');
   return '<tr>'+cells.join('')+'</tr>';
 }).join('')).join('');
 content.innerHTML='<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Тип уборки</th><th class="group" colspan="3">Время</th><th>ФИО ответственного лица</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
[monthFilter,dateFrom,dateTo].forEach(el=>el.addEventListener('change',draw));
document.getElementById('resetFilters').addEventListener('click',()=>{monthFilter.value='';dateFrom.value='';dateTo.value='';draw()});
fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SPREADSHEET_ID+'/values/'+encodeURIComponent(SHEET_RANGE)+'?key='+API_KEY)
.then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
.then(d=>init(d.values||[]))
.catch(e=>{content.innerHTML='<div class="state error">Не удалось загрузить данные журнала. Проверьте, что Google-таблица доступна для чтения по ссылке, а вкладка называется «Текущий месяц». ('+esc(e.message)+')</div>';rowCount.textContent='Ошибка загрузки'});
})();
</script>
</body>
</html>
