<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки для СГИ — НАССР</title>
<script src="auth-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;
    --surface:#ffffff;
    --border:#e4e2d9;
    --border-strong:#c9c6b8;
    --text:#20201c;
    --text-secondary:#6b6a61;
    --text-muted:#98968a;
    --accent:#3a5a52;
    --accent-soft:#e8efec;
    --danger:#9c3b34;
    --danger-soft:#fbebe9;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1200px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--text-secondary);
    text-decoration:none;
    margin-bottom:20px;
  }
  .back-link:hover{color:var(--accent);}
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .header-text h1{
    font-size:22px;
    font-weight:700;
    margin:0 0 6px;
  }
  header p{
    font-size:13px;
    color:var(--text-secondary);
    margin:0;
  }
  .user-badge{
    font-size:12px;
    color:var(--text-muted);
    margin-top:8px;
  }
  .user-badge b{color:var(--text-secondary);}
  .ext-links{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .ext-links a, .ext-links button{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    color:var(--accent);
    background:var(--accent-soft);
    border:1px solid var(--border);
    border-radius:999px;
    padding:8px 14px;
    font-family:inherit;
    cursor:pointer;
  }
  .ext-links a:hover, .ext-links button:hover{border-color:var(--border-strong);}
  .ext-links .create-btn{
    color:#fff;
    background:var(--accent);
    border-color:var(--accent);
  }
  .ext-links .create-btn:hover{opacity:0.92; border-color:var(--accent);}

  .toolbar{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin:20px 0 18px;
  }
  .search-box{
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:11px 16px 11px 40px;
    border:1px solid var(--border-strong);
    border-radius:999px;
    font-size:14px;
    font-family:inherit;
    background:var(--surface);
    color:var(--text);
  }
  .search-box input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .search-box svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    stroke:var(--text-muted);
  }
  .status-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .status-tabs::-webkit-scrollbar{display:none;}
  .status-tab{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:9px 14px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
    font-size:13px;
    font-weight:600;
    color:var(--text);
  }
  .status-tab:hover{border-color:var(--border-strong);}
  .status-tab.active{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }
  .status-tab .count{
    color:var(--text-muted);
    font-weight:500;
  }
  .status-tab.active .count{color:var(--accent);}

  .row-count{
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:12px;
  }

  .state-box{
    text-align:center;
    padding:50px 20px;
    color:var(--text-muted);
    font-size:14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .state-box.error{
    color:var(--danger);
    background:var(--danger-soft);
    border-color:transparent;
  }

  .table-scroll{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:auto;
    max-width:100%;
  }
  table{
    border-collapse:collapse;
    width:100%;
    font-size:13px;
  }
  thead th{
    position:sticky;
    top:0;
    background:var(--accent-soft);
    color:var(--text);
    text-align:left;
    padding:10px 14px;
    font-weight:600;
    border-bottom:1px solid var(--border-strong);
    white-space:nowrap;
  }
  th.sortable{
    cursor:pointer;
    user-select:none;
  }
  th.sortable:hover{background:#dfe9e5;}
  th .sort-arrow{
    display:inline-block;
    margin-left:4px;
    color:var(--text-muted);
    font-size:11px;
  }
  th.sort-active .sort-arrow{color:var(--accent);}
  tbody td{
    padding:9px 14px;
    border-bottom:1px solid var(--border);
    color:var(--text-secondary);
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:#fbfaf7;}
  td.name-cell{
    color:var(--text);
    font-weight:500;
    min-width:200px;
  }

  .status-select{
    padding:7px 10px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    min-width:190px;
  }
  .status-select:disabled{
    opacity:0.5;
    cursor:wait;
  }
  .status-select.s-open{ color:#8a6416; border-color:#ecd9ab; background:#fdf3e3; }
  .status-select.s-inprogress{ color:#1d5fa8; border-color:#bcd6f0; background:#eaf2fc; }
  .status-select.s-done{ color:var(--accent); border-color:#c7dcd5; background:var(--accent-soft); }
  .status-select.s-doneclean{ color:#2f7a3e; border-color:#bfe0c7; background:#eaf7ec; }

  .cell-muted{color:var(--text-muted); font-size:12px; white-space:nowrap;}

  .save-error{
    font-size:11px;
    color:var(--danger);
    margin-top:4px;
  }

  /* ==== Модальное окно создания заявки ==== */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--surface);
    border-radius:var(--radius);
    max-width:440px;
    width:100%;
    padding:24px;
    max-height:90vh;
    overflow:auto;
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .modal-header h3{
    font-size:16px;
    font-weight:700;
    margin:0;
  }
  .modal-close{
    background:none;
    border:none;
    font-size:20px;
    color:var(--text-muted);
    cursor:pointer;
    line-height:1;
    padding:4px;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--text-secondary);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:var(--bg);
    color:var(--text);
  }
  .field input:focus, .field select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .modal-submit{
    width:100%;
    padding:13px 16px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    margin-top:6px;
  }
  .modal-submit:hover{opacity:0.92;}
  .modal-submit:disabled{opacity:0.6; cursor:wait;}
  .modal-error{
    font-size:13px;
    color:var(--danger);
    background:var(--danger-soft);
    border-radius:8px;
    padding:9px 12px;
    margin-bottom:14px;
    display:none;
  }
  .modal-error.show{display:block;}
  .modal-success{
    font-size:13px;
    color:var(--accent);
    background:var(--accent-soft);
    border-radius:8px;
    padding:9px 12px;
    margin-bottom:14px;
    display:none;
  }
  .modal-success.show{display:block;}
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="index.html">← Все журналы</a>

  <header>
    <div class="header-text">
      <h1>Заявки для СГИ</h1>
      <p>Список заявок с возможностью менять статус прямо на сайте</p>
      <div class="user-badge">Вы вошли как: <b id="currentUserName">—</b></div>
    </div>
  </header>

  <div class="ext-links">
    <a href="#" id="sheetLink" target="_blank" rel="noopener">📊 Открыть таблицу</a>
    <button class="create-btn" id="openCreateModal" type="button">➕ Создать заявку</button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Поиск по наименованию, участку, оборудованию" autocomplete="off">
    </div>
    <div class="status-tabs" id="statusTabs"></div>
  </div>

  <div class="row-count" id="rowCount"></div>

  <div id="content">
    <div class="state-box" id="stateBox">Загрузка данных…</div>
  </div>
</div>

<!-- Модальное окно создания заявки -->
<div class="modal-overlay" id="createOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>Новая заявка для СГИ</h3>
      <button class="modal-close" id="createClose" type="button" aria-label="Закрыть">✕</button>
    </div>

    <div class="modal-error" id="createError"></div>
    <div class="modal-success" id="createSuccess">Заявка успешно создана ✓</div>

    <form id="createForm">
      <div class="field">
        <label for="fieldName">Наименование заявки</label>
        <input type="text" id="fieldName" required autocomplete="off">
      </div>
      <div class="field">
        <label for="fieldArea">Участок</label>
        <select id="fieldArea" required></select>
      </div>
      <div class="field">
        <label for="fieldEquipment">Оборудование</label>
        <input type="text" id="fieldEquipment" required autocomplete="off">
      </div>
      <button type="submit" class="modal-submit" id="createSubmit">Отправить заявку</button>
    </form>
  </div>
</div>

<script>
  // ==== НАСТРОЙКИ — впишите свои значения ====

  // API-ключ Google Sheets API (тот же, что в journal.html/master.html)
  const API_KEY = 'AIzaSyCrXcA6Rzohxe0bWBD3W8veWLprb47m2lY';

  // ID таблицы "Заявки для СГИ" и название листа с заявками
  const SHEET_ID = '1hj5v7Gcz5usvdb40QyDJSnpUNtxnjfiw35ISt-g-cSU';
  const SHEET_NAME = 'Ответы на форму (1)';

  // Ссылка для кнопки "Открыть таблицу"
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1hj5v7Gcz5usvdb40QyDJSnpUNtxnjfiw35ISt-g-cSU/edit?gid=1339045562#gid=1339045562';

  // URL опубликованного Apps Script Web App (заканчивается на /exec) — тот же, что в sgi-login.html
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZIvCHbIKEoj-AhrEa7hNJn5bChBNt8bxPoyoNcX5dEpT1ACRodRkMvfIzYfzMLVAr/exec';

  // ==== Статусы ====
  const STATUSES = [
    'Открыта',
    'В работе',
    'Выполнена',
    'Выполнена. Проведена мойка и дезинфекция'
  ];

  const STATUS_CLASS = {
    'Открыта': 's-open',
    'В работе': 's-inprogress',
    'Выполнена': 's-done',
    'Выполнена. Проведена мойка и дезинфекция': 's-doneclean'
  };

  // ==== Участки для выпадающего списка в форме создания заявки ====
  const AREAS = [
    'RND', 'АХО', 'Бухгалтерия', 'Горячий цех', 'Другое',
    'Комната начальников цехов', 'Комната технологов', 'Котломойка',
    'Мясной цех', 'Овощной цех', 'Опенспейс', 'Отдел контроля качества',
    'Склад готовой продукции', 'Склад сухих компонентов', 'Склад сырья',
    'Столовая', 'Холодный цех', 'Цех сборки', 'Цех упаковки', 'Цех фасовки'
  ];

  document.getElementById('sheetLink').href = SHEET_URL;

  // ==== Личная сессия (кто вошёл) ====
  const SESSION_KEY = 'gcheck_sgi_user';
  const SESSION_TTL_MS = 12 * 60 * 60 * 1000; // 12 часов

  let currentUser = null;
  try{
    const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if(saved && saved.name && saved.time && (Date.now() - saved.time) < SESSION_TTL_MS){
      currentUser = saved.name;
    }
  } catch(e){ /* игнорируем повреждённые данные сессии */ }

  if(!currentUser){
    location.replace('sgi-login.html');
  } else {
    document.getElementById('currentUserName').textContent = currentUser;
  }

  // ==== Состояние списка заявок ====
  let header = [];
  let colIdx = {};
  let rows = [];
  let activeStatus = null; // null = "Все"
  let searchQuery = '';
  let sortCol = 0;          // по умолчанию сортируем по "Дата создания"
  let sortDir = -1;         // -1 = по убыванию — новые заявки сверху

  const contentEl = document.getElementById('content');
  const stateBox = document.getElementById('stateBox');
  const rowCountEl = document.getElementById('rowCount');
  const statusTabsEl = document.getElementById('statusTabs');
  const searchInput = document.getElementById('searchInput');

  // Порядок должен совпадать со столбцами в таблице
  const COLUMN_KEYS = ['Дата создания', 'Наименование заявки', 'Участок', 'Оборудование', 'Статус', 'Заявитель', 'Взято в работу', 'Дата закрытия'];
  // Индексы внутри COLUMN_KEYS для удобства
  const IDX = { createdAt: 0, name: 1, area: 2, equipment: 3, status: 4, requester: 5, takenAt: 6, closedAt: 7 };

  function loadData(){
    const range = encodeURIComponent(SHEET_NAME);
    const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}`;

    fetch(apiUrl)
      .then(r => {
        if(!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(data => {
        const values = data.values || [];
        if(values.length === 0){
          stateBox.textContent = 'В таблице пока нет ни одной заявки.';
          return;
        }
        header = values[0];
        colIdx = {};
        header.forEach((h, i) => { colIdx[String(h).trim()] = i; });

        const missing = COLUMN_KEYS.filter(k => !(k in colIdx));
        if(missing.length > 0){
          stateBox.textContent = 'В таблице не найдены столбцы: ' + missing.join(', ') + '. Проверьте заголовки в первой строке таблицы.';
          stateBox.classList.add('error');
          return;
        }

        rows = values.slice(1).map((r, i) => ({
          rowIndex: i + 2,
          cells: COLUMN_KEYS.map(k => r[colIdx[k]] || '')
        })).filter(row => row.cells.some(c => c !== ''));

        renderStatusTabs();
        renderTable();
      })
      .catch(err => {
        stateBox.textContent = 'Не удалось загрузить данные таблицы. Проверьте SHEET_ID, API_KEY и доступ "по ссылке — Читатель". (' + err.message + ')';
        stateBox.classList.add('error');
      });
  }

  function renderStatusTabs(){
    const counts = {};
    STATUSES.forEach(s => counts[s] = 0);
    rows.forEach(r => {
      const s = r.cells[IDX.status];
      if(counts[s] !== undefined) counts[s]++;
    });

    const allBtn = `<button class="status-tab${activeStatus === null ? ' active' : ''}" data-status="">Все <span class="count">(${rows.length})</span></button>`;
    const tabs = STATUSES.map(s =>
      `<button class="status-tab${activeStatus === s ? ' active' : ''}" data-status="${escapeHtml(s)}">${escapeHtml(s)} <span class="count">(${counts[s]})</span></button>`
    ).join('');

    statusTabsEl.innerHTML = allBtn + tabs;

    statusTabsEl.querySelectorAll('.status-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeStatus = btn.dataset.status || null;
        renderStatusTabs();
        renderTable();
      });
    });
  }

  function renderTable(){
    let filtered = rows;
    if(activeStatus){
      filtered = filtered.filter(r => r.cells[IDX.status] === activeStatus);
    }
    if(searchQuery){
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(r =>
        r.cells[IDX.name].toLowerCase().includes(q) ||
        r.cells[IDX.area].toLowerCase().includes(q) ||
        r.cells[IDX.equipment].toLowerCase().includes(q) ||
        r.cells[IDX.requester].toLowerCase().includes(q)
      );
    }

    if(sortCol !== null){
      filtered = filtered.slice().sort((a, b) => {
        const av = a.cells[sortCol] || '';
        const bv = b.cells[sortCol] || '';
        const ad = parseRuDate(av), bd = parseRuDate(bv);
        let cmp;
        if(ad !== null && bd !== null){
          cmp = ad - bd;
        } else if(ad !== null && bd === null){
          cmp = -1;
        } else if(ad === null && bd !== null){
          cmp = 1;
        } else {
          cmp = av.localeCompare(bv, 'ru');
        }
        return cmp * sortDir;
      });
    }

    rowCountEl.textContent = `Заявок: ${filtered.length} из ${rows.length}`;

    if(filtered.length === 0){
      contentEl.innerHTML = '<div class="state-box">Ничего не найдено.</div>';
      return;
    }

    const HEADERS = ['Дата создания', 'Наименование заявки', 'Участок', 'Оборудование', 'Статус', 'Заявитель', 'Взято в работу', 'Дата закрытия'];
    const theadHtml = '<thead><tr>' + HEADERS.map((h, i) => {
      if(i === IDX.status){
        return `<th>${h}</th>`;
      }
      const active = sortCol === i;
      const arrow = active ? (sortDir === 1 ? '▲' : '▼') : '↕';
      return `<th class="sortable${active ? ' sort-active' : ''}" data-col="${i}">${h}<span class="sort-arrow">${arrow}</span></th>`;
    }).join('') + '</tr></thead>';

    const tbodyHtml = '<tbody>' + filtered.map(r => `
      <tr data-row-index="${r.rowIndex}">
        <td class="cell-muted">${escapeHtml(r.cells[IDX.createdAt])}</td>
        <td class="name-cell">${escapeHtml(r.cells[IDX.name])}</td>
        <td>${escapeHtml(r.cells[IDX.area])}</td>
        <td>${escapeHtml(r.cells[IDX.equipment])}</td>
        <td>
          <select class="status-select ${STATUS_CLASS[r.cells[IDX.status]] || ''}" data-row-index="${r.rowIndex}">
            ${STATUSES.map(s => `<option value="${escapeHtml(s)}"${s === r.cells[IDX.status] ? ' selected' : ''}>${escapeHtml(s)}</option>`).join('')}
          </select>
        </td>
        <td class="cell-muted">${escapeHtml(r.cells[IDX.requester])}</td>
        <td class="cell-muted taken-at-cell">${escapeHtml(r.cells[IDX.takenAt])}</td>
        <td class="cell-muted closed-at-cell">${escapeHtml(r.cells[IDX.closedAt])}</td>
      </tr>
    `).join('') + '</tbody>';

    contentEl.innerHTML = `<div class="table-scroll"><table>${theadHtml}${tbodyHtml}</table></div>`;

    contentEl.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', onStatusChange);
    });

    contentEl.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const col = parseInt(th.dataset.col, 10);
        if(sortCol === col){
          sortDir = -sortDir;
        } else {
          sortCol = col;
          sortDir = 1;
        }
        renderTable();
      });
    });
  }

  function parseRuDate(str){
    if(!str) return null;
    const m = String(str).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if(!m) return null;
    const [, d, mo, y, h, mi, s] = m;
    const dt = new Date(
      parseInt(y, 10),
      parseInt(mo, 10) - 1,
      parseInt(d, 10),
      h ? parseInt(h, 10) : 0,
      mi ? parseInt(mi, 10) : 0,
      s ? parseInt(s, 10) : 0
    );
    return isNaN(dt.getTime()) ? null : dt.getTime();
  }

  function onStatusChange(e){
    const select = e.target;
    const rowIndex = parseInt(select.dataset.rowIndex, 10);
    const newStatus = select.value;
    const tr = select.closest('tr');

    select.disabled = true;
    select.className = 'status-select ' + (STATUS_CLASS[newStatus] || '');

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'setStatus', rowIndex, newStatus })
    })
      .then(r => r.json())
      .then(res => {
        if(!res.ok){
          throw new Error(res.error || 'Неизвестная ошибка');
        }
        const rowData = rows.find(r => r.rowIndex === rowIndex);
        if(rowData){
          rowData.cells[IDX.status] = newStatus;
          if(res.takenAt) rowData.cells[IDX.takenAt] = res.takenAt;
          if(res.closedAt) rowData.cells[IDX.closedAt] = res.closedAt;
        }
        if(tr){
          tr.querySelector('.taken-at-cell').textContent = rowData ? rowData.cells[IDX.takenAt] : '';
          tr.querySelector('.closed-at-cell').textContent = rowData ? rowData.cells[IDX.closedAt] : '';
        }
        select.disabled = false;
        renderStatusTabs();
      })
      .catch(err => {
        select.disabled = false;
        const rowData = rows.find(r => r.rowIndex === rowIndex);
        if(rowData) select.value = rowData.cells[IDX.status];
        select.className = 'status-select ' + (STATUS_CLASS[rowData ? rowData.cells[IDX.status] : ''] || '');

        let errBox = tr.querySelector('.save-error');
        if(!errBox){
          errBox = document.createElement('div');
          errBox.className = 'save-error';
          select.closest('td').appendChild(errBox);
        }
        errBox.textContent = 'Не удалось сохранить: ' + err.message;
        setTimeout(() => { if(errBox) errBox.remove(); }, 5000);
      });
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim();
    renderTable();
  });

  if(currentUser){
    loadData();
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // ==== Модальное окно "Создать заявку" ====
  const createOverlay = document.getElementById('createOverlay');
  const openCreateModal = document.getElementById('openCreateModal');
  const createClose = document.getElementById('createClose');
  const createForm = document.getElementById('createForm');
  const createError = document.getElementById('createError');
  const createSuccess = document.getElementById('createSuccess');
  const createSubmit = document.getElementById('createSubmit');
  const fieldName = document.getElementById('fieldName');
  const fieldArea = document.getElementById('fieldArea');
  const fieldEquipment = document.getElementById('fieldEquipment');

  fieldArea.innerHTML = '<option value="" disabled selected>Выберите участок</option>' +
    AREAS.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');

  openCreateModal.addEventListener('click', () => {
    createOverlay.classList.add('show');
    createError.classList.remove('show');
    createSuccess.classList.remove('show');
    createForm.reset();
    fieldArea.selectedIndex = 0;
  });

  createClose.addEventListener('click', closeCreateModal);
  createOverlay.addEventListener('click', (e) => { if(e.target === createOverlay) closeCreateModal(); });

  function closeCreateModal(){
    createOverlay.classList.remove('show');
  }

  createForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    createError.classList.remove('show');
    createSuccess.classList.remove('show');
    createSubmit.disabled = true;
    createSubmit.textContent = 'Отправляем...';

    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'createRequest',
          name: fieldName.value.trim(),
          area: fieldArea.value,
          equipment: fieldEquipment.value.trim(),
          requester: currentUser
        })
      });
      const data = await res.json();
      if(!data.ok){
        throw new Error(data.error || 'Неизвестная ошибка');
      }

      createSuccess.classList.add('show');
      createSubmit.textContent = 'Отправить заявку';
      createSubmit.disabled = false;
      createForm.reset();
      fieldArea.selectedIndex = 0;

      setTimeout(() => {
        closeCreateModal();
        loadData(); // обновляем список, чтобы новая заявка появилась сразу
      }, 900);

    } catch(err){
      createError.textContent = 'Не удалось создать заявку: ' + err.message;
      createError.classList.add('show');
      createSubmit.disabled = false;
      createSubmit.textContent = 'Отправить заявку';
    }
  });
</script>
