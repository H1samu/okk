<!DOCTYPE html>
<html lang="ru">
<head>
<script src="auth-guard.js"></script>
<script>
  if(!window.gcheckUser || (window.gcheckUser.type || '').trim().toLowerCase() !== 'администратор'){
    location.replace('index.html');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контроль заполнения — Hismar Check</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1; --surface:#ffffff; --border:#e4e2d9; --border-strong:#c9c6b8;
    --text:#20201c; --text-secondary:#6b6a61; --text-muted:#98968a;
    --accent:#3a5a52; --accent-soft:#e8efec; --danger:#9c3b34; --danger-soft:#fbebe9;
    --warn:#8a6416; --warn-soft:#fdf3d8; --ok:#2f7a3e; --ok-soft:#e8f5ea;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Manrope', Arial, sans-serif; -webkit-font-smoothing:antialiased;}
  button, input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .wrap{max-width:1200px; margin:0 auto; padding:24px 20px 60px;}
  .back-link{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary); text-decoration:none; margin-bottom:20px; padding:6px 0;}
  .back-link:hover{color:var(--accent);}
  h1{font-size:22px; font-weight:700; margin:0 0 6px;}
  header p{font-size:13px; color:var(--text-secondary); margin:0 0 18px;}

  .summary{display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:14px;}
  .sum{
    text-align:left; padding:12px 14px; border-radius:var(--radius);
    border:1px solid var(--border); background:var(--surface); cursor:pointer;
    min-height:64px; transition:border-color .15s ease, transform .1s ease;
  }
  .sum:hover{border-color:var(--border-strong);}
  .sum:active{transform:scale(0.98);}
  .sum .n{font-size:22px; font-weight:700; line-height:1.1;}
  .sum .l{font-size:12px; color:var(--text-secondary); margin-top:2px;}
  .sum.s-overdue .n{color:var(--danger);}
  .sum.s-pending .n{color:var(--warn);}
  .sum.s-ok .n{color:var(--ok);}
  .sum.active{border-width:2px; padding:11px 13px;}
  .sum.s-overdue.active{border-color:var(--danger); background:var(--danger-soft);}
  .sum.s-pending.active{border-color:#e3c06a; background:var(--warn-soft);}
  .sum.s-ok.active{border-color:#8fc79b; background:var(--ok-soft);}
  .sum.s-other.active{border-color:var(--accent); background:var(--accent-soft);}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
  .search-box{position:relative; flex:1 1 260px;}
  .search-box input{width:100%; height:46px; padding:0 16px 0 40px; border:1px solid var(--border-strong); border-radius:999px; font-size:14px; background:var(--surface); color:var(--text);}
  .search-box svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--text-muted);}
  .btn{height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text); font-size:13px; font-weight:600; cursor:pointer;}
  .btn:hover:not(:disabled){border-color:var(--accent);}
  .btn:disabled{opacity:0.6; cursor:wait;}

  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .chip{height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; color:var(--text); cursor:pointer; white-space:nowrap;}
  .chip:hover{border-color:var(--border-strong);}
  .chip.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}

  .meta{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); margin-bottom:12px;}
  .state-box{text-align:center; padding:50px 20px; color:var(--text-muted); font-size:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);}
  .state-box.error{color:var(--danger); background:var(--danger-soft); border-color:transparent;}
  .progress{height:4px; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:12px;}
  .progress > div{height:100%; width:0; background:var(--accent); transition:width .2s ease;}

  .table-scroll{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; max-width:100%; max-height:70vh;}
  table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px;}
  thead th{position:sticky; top:0; z-index:2; background:var(--accent-soft); text-align:left; padding:10px 14px; font-weight:600; border-bottom:1px solid var(--border-strong); white-space:nowrap;}
  th.sortable{cursor:pointer; user-select:none;}
  th.sortable:hover{background:#dfe9e5;}
  th .sort-arrow{margin-left:4px; color:var(--text-muted); font-size:11px;}
  th.sort-active .sort-arrow{color:var(--accent);}
  tbody td{padding:9px 14px; border-bottom:1px solid var(--border); color:var(--text-secondary); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:#fbfaf7;}
  td.code{white-space:nowrap; font-size:12px; font-weight:600; color:var(--text-muted);}
  td.jname{color:var(--text); font-weight:500; min-width:240px;}
  td.nowrap{white-space:nowrap;}
  .badge{display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap;}
  .b-overdue{background:var(--danger-soft); color:var(--danger);}
  .b-pending{background:var(--warn-soft); color:var(--warn);}
  .b-ok{background:var(--ok-soft); color:var(--ok);}
  .b-other{background:var(--bg); color:var(--text-secondary); border:1px solid var(--border);}
  tr.r-overdue td:first-child{box-shadow:inset 3px 0 0 #e0928b;}
  tr.r-pending td:first-child{box-shadow:inset 3px 0 0 #e3c06a;}
  tr.r-ok td:first-child{box-shadow:inset 3px 0 0 #8fc79b;}
  .open{display:inline-flex; align-items:center; height:36px; padding:0 12px; border-radius:8px; border:1px solid var(--border-strong); color:var(--accent); font-weight:600; text-decoration:none; font-size:12px; white-space:nowrap;}
  .open:hover{border-color:var(--accent);}
  mark{background:#fde68a; color:inherit; border-radius:3px;}
  @media (max-width:700px){ .summary{grid-template-columns:repeat(2, 1fr);} }
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="index.html">← Все журналы</a>

  <header>
    <h1>Контроль заполнения</h1>
    <p>Проверка по журналам: заполнены ли они в срок согласно периодичности</p>
  </header>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Поиск по коду или названию" autocomplete="off">
    </div>
    <button class="btn" id="refreshBtn" type="button">🔄 Обновить</button>
  </div>

  <div class="chips" id="freqChips"></div>
  <div class="chips" id="tagChips"></div>

  <div class="progress" id="progress" hidden><div id="progressBar"></div></div>
  <div class="meta"><span id="rowCount"></span><span id="updated"></span></div>

  <div id="content"><div class="state-box">Загрузка…</div></div>
</div>

<script>
  const API_KEY = 'AIzaSyCrXcA6Rzohxe0bWBD3W8veWLprb47m2lY';

  // Часовой пояс предприятия: по нему определяется "сегодня" и граница суток (24:00)
  const TIMEZONE = 'Europe/Moscow';

  // Журналы, у которых проверяются несколько листов (берётся самая свежая запись)
  const EXTRA_SHEETS = {
    'НАССР-Ч-09': ['Ответы на форму (1)'],
    'НАССР-Ч-13': ['Ответы на форму (1)'],
    'НАССР-Ч-14': ['Ответы на форму (1)'],
    'НАССР-Ч-15': ['Ответы на форму (1)']
  };

  const FREQS = ['Ежедневно', '2 раза в день', '1 раз в три дня', '1 раз в неделю', '1 раз в месяц', 'Произвольно'];
  const TAG_ORDER = ['Санитария','АХО','Оборудование','Продукт','Включения','Температурные','Вредители','Учёт','Прочее'];
  const CONCURRENCY = 6;

  // Группы статусов
  const GROUPS = [
    { key:'overdue', label:'Просрочено', cls:'s-overdue' },
    { key:'pending', label:'Ожидается', cls:'s-pending' },
    { key:'ok',      label:'Выполнено', cls:'s-ok' },
    { key:'other',   label:'Нет данных / без контроля', cls:'s-other' }
  ];
  const STATUS_META = {
    overdue:{ group:'overdue', label:'🔴 Просрочено', badge:'b-overdue', order:0 },
    pending:{ group:'pending', label:'🕒 Ожидается',  badge:'b-pending', order:1 },
    nodata: { group:'other',   label:'⚪ Нет записей', badge:'b-other',   order:2 },
    error:  { group:'other',   label:'⚠ Ошибка чтения', badge:'b-other', order:3 },
    nofreq: { group:'other',   label:'⚪ Периодичность не задана', badge:'b-other', order:4 },
    ok:     { group:'ok',      label:'✅ Выполнено',  badge:'b-ok',      order:5 },
    free:   { group:'other',   label:'ℹ Произвольно', badge:'b-other',   order:6 }
  };

  const contentEl = document.getElementById('content');
  const summaryEl = document.getElementById('summary');
  const rowCountEl = document.getElementById('rowCount');
  const updatedEl = document.getElementById('updated');
  const searchInput = document.getElementById('searchInput');
  const refreshBtn = document.getElementById('refreshBtn');
  const freqChipsEl = document.getElementById('freqChips');
  const tagChipsEl = document.getElementById('tagChips');
  const progressEl = document.getElementById('progress');
  const progressBar = document.getElementById('progressBar');

  let items = [];          // {journal, freq, stat, status, note, sortKey}
  let activeGroup = '';
  let activeFreq = '';
  let activeTag = '';
  let sortCol = 'status';
  let sortDir = 1;

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function highlight(text, q){
    if(!q) return escapeHtml(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if(i === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0,i)) + '<mark>' + escapeHtml(text.slice(i, i+q.length)) + '</mark>' + escapeHtml(text.slice(i+q.length));
  }
  function splitName(j){
    const full = j.name || '';
    if(j.id && full.startsWith(j.id)) return { code:j.id, title: full.slice(j.id.length).trim() || full };
    return { code:j.id || '', title: full };
  }
  function normFreq(v){
    const t = String(v || '').replace(/\s+/g,' ').trim().toLowerCase();
    return FREQS.find(f => f.toLowerCase() === t) || '';
  }

  // ===== Время =====
  const dayNumOf = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / 86400000); // m: 1..12
  const monthKeyOf = (y, m) => y * 12 + (m - 1);

  function nowInTz(){
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: TIMEZONE, year:'numeric', month:'2-digit', day:'2-digit'
    }).format(new Date()).split('-').map(Number);
    return { y:parts[0], m:parts[1], d:parts[2] };
  }

  function parseRu(str){
    const m = String(str || '').trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
    if(!m) return null;
    const d = +m[1], mo = +m[2], y = +m[3];
    const t = Date.UTC(y, mo - 1, d, +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    return { y, mo, d, day: dayNumOf(y, mo, d), month: monthKeyOf(y, mo), t };
  }

  // ===== Чтение таблиц =====
  async function fetchColumn(sheetId, sheetName, attempt){
    attempt = attempt || 1;
    const range = encodeURIComponent(`'${sheetName.replace(/'/g, "''")}'!A:A`);
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}?key=${API_KEY}`;
    const r = await fetch(url);
    if(r.status === 429 && attempt < 3){
      await new Promise(res => setTimeout(res, 1500 * attempt));
      return fetchColumn(sheetId, sheetName, attempt + 1);
    }
    if(!r.ok) throw new Error('http ' + r.status);
    const data = await r.json();
    return (data.values || []).slice(1).map(v => v[0]); // без заголовка
  }

  async function loadTimestamps(j){
    const names = [j.sheetName].concat(EXTRA_SHEETS[j.id] || []);
    const seen = new Set();
    let lastErr = null, okCount = 0;
    const all = [];
    for(const name of names){
      if(!name || seen.has(name)) continue;
      seen.add(name);
      try{
        const col = await fetchColumn(j.sheetId, name);
        okCount++;
        col.forEach(v => { const p = parseRu(v); if(p) all.push(p); });
      } catch(e){ lastErr = e; }
    }
    if(okCount === 0) throw lastErr || new Error('нет листа');
    return all;
  }

  // ===== Статистика и правила =====
  function buildStat(records, today){
    const todayDay = dayNumOf(today.y, today.m, today.d);
    const weekStart = todayDay - ((todayDay + 3) % 7);       // понедельник текущей недели
    const curMonth = monthKeyOf(today.y, today.m);
    const s = { total: records.length, last: null, lastT: null, today:0, yest:0, wk:0, pwk:0, mo:0, pmo:0, todayDay };
    records.forEach(p => {
      if(s.lastT === null || p.t > s.lastT){ s.lastT = p.t; s.last = p; }
      if(p.day === todayDay) s.today++;
      if(p.day === todayDay - 1) s.yest++;
      if(p.day >= weekStart && p.day <= weekStart + 6) s.wk++;
      if(p.day >= weekStart - 7 && p.day < weekStart) s.pwk++;
      if(p.month === curMonth) s.mo++;
      if(p.month === curMonth - 1) s.pmo++;
    });
    return s;
  }

  function evaluate(freq, s){
    if(!freq) return { status:'nofreq', note:'Укажите fillFrequency в journals.json' };
    if(s.total === 0){
      return { status: freq === 'Произвольно' ? 'free' : 'nodata', note:'В таблице нет записей' };
    }
    const age = s.todayDay - s.last.day; // дней с последней записи
    switch(freq){
      case 'Ежедневно':
        if(s.today >= 1) return { status:'ok', note:'Есть запись сегодня' };
        if(s.yest >= 1) return { status:'pending', note:'Сегодня записи ещё нет (до 24:00)' };
        return { status:'overdue', note:`Нет записей уже ${age} дн.` };
      case '2 раза в день':
        if(s.today >= 2) return { status:'ok', note:`Сегодня ${s.today} из 2` };
        if(s.yest < 2) return { status:'overdue', note:`Вчера было ${s.yest} из 2` };
        return { status:'pending', note:`Сегодня ${s.today} из 2 (до 24:00)` };
      case '1 раз в три дня':
        if(age <= 2) return { status:'ok', note: age === 0 ? 'Запись сегодня' : `Последняя ${age} дн. назад` };
        if(age === 3) return { status:'pending', note:'Сегодня последний день' };
        return { status:'overdue', note:`Нет записей ${age} дн.` };
      case '1 раз в неделю':
        if(s.wk >= 1) return { status:'ok', note:'Есть запись на этой неделе' };
        if(s.pwk >= 1) return { status:'pending', note:'На этой неделе записи ещё нет' };
        return { status:'overdue', note:'Нет записей за прошлую неделю' };
      case '1 раз в месяц':
        if(s.mo >= 1) return { status:'ok', note:'Есть запись в этом месяце' };
        if(s.pmo >= 1) return { status:'pending', note:'В этом месяце записи ещё нет' };
        return { status:'overdue', note:'Нет записей за прошлый месяц' };
      default: // Произвольно
        return { status:'free', note:'Без контроля срока' };
    }
  }

  function fmtLast(p){
    if(!p) return '—';
    const pad = n => String(n).padStart(2,'0');
    const dt = new Date(p.t);
    return `${pad(p.d)}.${pad(p.mo)}.${p.y} ${pad(dt.getUTCHours())}:${pad(dt.getUTCMinutes())}`;
  }

  // ===== Загрузка всего =====
  async function loadAll(){
    refreshBtn.disabled = true;
    progressEl.hidden = false;
    progressBar.style.width = '0%';
    contentEl.innerHTML = '<div class="state-box">Загрузка журналов…</div>';

    let journals;
    try{
      const r = await fetch('journals.json', { cache:'no-cache' });
      if(!r.ok) throw new Error('http ' + r.status);
      journals = await r.json();
    } catch(e){
      contentEl.innerHTML = '<div class="state-box error">Не удалось загрузить journals.json</div>';
      refreshBtn.disabled = false; progressEl.hidden = true;
      return;
    }

    const today = nowInTz();
    const list = journals.map(j => ({
      journal: Object.assign({}, j, { tags:(j.tags || []).map(t => t === 'Учет' ? 'Учёт' : t) }),
      freq: normFreq(j.fillFrequency),
      stat: null, status:'nodata', note:''
    }));

    let done = 0, idx = 0;
    async function worker(){
      while(idx < list.length){
        const it = list[idx++];
        const j = it.journal;
        if(!it.freq){
          Object.assign(it, evaluate('', buildStat([], today)));
        } else if(!j.sheetId || !j.sheetName){
          it.status = 'error'; it.note = 'Не указан sheetId / sheetName';
        } else {
          try{
            const recs = await loadTimestamps(j);
            it.stat = buildStat(recs, today);
            Object.assign(it, evaluate(it.freq, it.stat));
          } catch(e){
            it.status = 'error'; it.note = 'Не удалось прочитать таблицу (' + e.message + ')';
          }
        }
        done++;
        progressBar.style.width = Math.round(done / list.length * 100) + '%';
      }
    }
    await Promise.all(Array.from({length: CONCURRENCY}, worker));

    items = list;
    progressEl.hidden = true;
    refreshBtn.disabled = false;
    const now = new Date();
    updatedEl.textContent = 'Обновлено: ' + now.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
    renderFilters();
    draw();
  }

  // ===== Отрисовка =====
  function baseFiltered(ignoreGroup){
    const q = searchInput.value.trim().toLowerCase();
    return items.filter(it => {
      if(activeFreq && it.freq !== activeFreq) return false;
      if(activeTag && !it.journal.tags.includes(activeTag)) return false;
      if(q && !it.journal.name.toLowerCase().includes(q)) return false;
      if(!ignoreGroup && activeGroup && STATUS_META[it.status].group !== activeGroup) return false;
      return true;
    });
  }

  function renderFilters(){
    freqChipsEl.innerHTML = '<button type="button" class="chip' + (!activeFreq ? ' active' : '') + '" data-freq="">Любая периодичность</button>' +
      FREQS.map(f => `<button type="button" class="chip${activeFreq === f ? ' active' : ''}" data-freq="${escapeHtml(f)}">${escapeHtml(f)}</button>`).join('');
    const tags = TAG_ORDER.filter(t => items.some(it => it.journal.tags.includes(t)));
    tagChipsEl.innerHTML = '<button type="button" class="chip' + (!activeTag ? ' active' : '') + '" data-tag="">Все категории</button>' +
      tags.map(t => `<button type="button" class="chip${activeTag === t ? ' active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('');
  }

  function renderSummary(){
    const base = baseFiltered(true);
    const counts = { overdue:0, pending:0, ok:0, other:0 };
    base.forEach(it => counts[STATUS_META[it.status].group]++);
    summaryEl.innerHTML = GROUPS.map(g => `
      <button type="button" class="sum ${g.cls}${activeGroup === g.key ? ' active' : ''}" data-group="${g.key}">
        <div class="n">${counts[g.key]}</div><div class="l">${g.label}</div>
      </button>`).join('');
  }

  function sortValue(it, col){
    switch(col){
      case 'code': return it.journal.id;
      case 'name': return splitName(it.journal).title;
      case 'freq': return FREQS.indexOf(it.freq);
      case 'last': return it.stat && it.stat.lastT ? it.stat.lastT : -1;
      default:     return STATUS_META[it.status].order;
    }
  }

  function draw(){
    renderSummary();
    const q = searchInput.value.trim();
    let rows = baseFiltered(false).slice().sort((a, b) => {
      const av = sortValue(a, sortCol), bv = sortValue(b, sortCol);
      let c = typeof av === 'string' ? av.localeCompare(bv, 'ru', { numeric:true }) : av - bv;
      if(c === 0) c = a.journal.id.localeCompare(b.journal.id, 'ru', { numeric:true });
      return c * sortDir;
    });

    rowCountEl.textContent = `Журналов: ${rows.length} из ${items.length}`;
    if(rows.length === 0){
      contentEl.innerHTML = '<div class="state-box">Ничего не найдено.</div>';
      return;
    }

    const heads = [['code','Код'],['name','Журнал'],['freq','Периодичность'],['last','Последняя запись'],['status','Статус'],[null,'Комментарий'],[null,'']];
    const thead = '<thead><tr>' + heads.map(([k, h]) => {
      if(!k) return `<th>${h}</th>`;
      const act = sortCol === k;
      return `<th class="sortable${act ? ' sort-active' : ''}" data-col="${k}">${h}<span class="sort-arrow">${act ? (sortDir === 1 ? '▲' : '▼') : '↕'}</span></th>`;
    }).join('') + '</tr></thead>';

    const tbody = '<tbody>' + rows.map(it => {
      const { code, title } = splitName(it.journal);
      const m = STATUS_META[it.status];
      return `<tr class="r-${m.group}">
        <td class="code">${highlight(code, q)}</td>
        <td class="jname">${highlight(title, q)}</td>
        <td class="nowrap">${escapeHtml(it.freq || '—')}</td>
        <td class="nowrap">${escapeHtml(fmtLast(it.stat && it.stat.last))}</td>
        <td><span class="badge ${m.badge}">${m.label}</span></td>
        <td>${escapeHtml(it.note)}</td>
        <td><a class="open" href="journal.html?id=${encodeURIComponent(it.journal.id)}">Открыть</a></td>
      </tr>`;
    }).join('') + '</tbody>';

    contentEl.innerHTML = `<div class="table-scroll"><table>${thead}${tbody}</table></div>`;
    contentEl.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const c = th.dataset.col;
        if(sortCol === c) sortDir = -sortDir; else { sortCol = c; sortDir = 1; }
        draw();
      });
    });
  }

  // ===== События =====
  summaryEl.addEventListener('click', e => {
    const b = e.target.closest('[data-group]'); if(!b) return;
    activeGroup = activeGroup === b.dataset.group ? '' : b.dataset.group;
    draw();
  });
  freqChipsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-freq]'); if(!b) return;
    activeFreq = b.dataset.freq; renderFilters(); draw();
  });
  tagChipsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-tag]'); if(!b) return;
    activeTag = b.dataset.tag; renderFilters(); draw();
  });
  searchInput.addEventListener('input', draw);
  refreshBtn.addEventListener('click', loadAll);

  loadAll();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>

</body>
</html>
