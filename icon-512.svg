<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512"
     preserveAspectRatio="xMidYMid meet">
  <title>Hismar Check app icon</title>
  <desc>Vector recreation of the supplied logo mark, without text, on a milky background.</desc>

  <!-- Milky background -->
  <rect width="512" height="512" fill="#F6F4EF"/>

  <!-- Original logo structure preserved and centered -->
  <g transform="translate(0 48.5) scale(1.27)">
    <!-- Navy vertical bars -->
    <rect x="44"  y="45" width="57" height="210" rx="28.5" fill="#123B67"/>
    <rect x="164" y="45" width="57" height="210" rx="28.5" fill="#123B67"/>
    <rect x="308" y="47" width="57" height="208" rx="28.5" fill="#123B67"/>

    <!-- Green check / trend line -->
    <path d="M74 172 L196 104 L252 150 L342 76"
          fill="none"
          stroke="#2DD98A"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
