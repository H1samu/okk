<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Журналы — Hismar Check</title>
<script src="auth-guard.js"></script>
<script src="favorites.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;
    --surface:#ffffff;
    --border:#e4e2d9;
    --border-strong:#c9c6b8;
    --text:#20201c;
    --text-secondary:#6b6a61;
    --text-muted:#98968a;
    --accent:#3a5a52;
    --accent-soft:#e8efec;
    --danger:#9c3b34;
    --danger-soft:#fbebe9;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:32px 20px 60px;
  }

  /* ===== Шапка ===== */
  header{
    text-align:center;
    margin-bottom:24px;
  }
  header .logo{
    height:48px;
    width:auto;
    margin-bottom:14px;
  }
  h1{
    font-size:26px;
    font-weight:700;
    margin:0 0 6px;
  }
  header p{
    font-size:14px;
    color:var(--text-secondary);
    margin:0;
  }

  /* ===== Поиск + QR ===== */
  .search-row{
    display:flex;
    align-items:center;
    gap:8px;
    max-width:520px;
    margin:24px auto 0;
  }
  .search-box{
    position:relative;
    flex:1;
  }
  .search-box input{
    width:100%;
    height:46px;
    padding:0 16px 0 42px;
    border:1px solid var(--border-strong);
    border-radius:999px;
    font-size:15px;
    font-family:inherit;
    background:var(--surface);
    color:var(--text);
  }
  .search-box input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .search-box svg{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    stroke:var(--text-muted);
  }
  .scan-btn{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:46px;
    min-width:46px;
    padding:0 14px;
    border-radius:999px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .scan-btn:hover{border-color:var(--accent);}
  .scan-btn .scan-label{display:none;}

  /* ===== Плитки разделов ===== */
  .quick-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    max-width:520px;
    margin:22px auto 0;
  }
  .tile{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:88px;
    padding:12px 8px;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:var(--surface);
    text-decoration:none;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .tile:hover{border-color:var(--border-strong);}
  .tile:active{transform:scale(0.97);}
  .tile .tile-icon{font-size:24px; line-height:1;}
  .tile .tile-text{
    font-size:13px;
    font-weight:600;
    color:var(--text);
    text-align:center;
    line-height:1.25;
  }
  .tile-master{ background:#fdf3e3; border-color:#ecd9ab; }
  .tile-master:hover{ border-color:#dcbf7e; }
  .tile-master .tile-text{ color:#8a6416; }
  .tile-sgi{ background:#eaf2fc; border-color:#bcd6f0; }
  .tile-sgi:hover{ border-color:#93bce4; }
  .tile-sgi .tile-text{ color:#1d5fa8; }
  .tile-fav.active{ background:#fdf7e3; border-color:#ecdca0; }
  .tile-badge{
    position:absolute;
    top:8px;
    right:8px;
    font-size:11px;
    font-weight:700;
    line-height:1;
  }
  .tile-badge.count{
    min-width:20px;
    height:20px;
    padding:0 6px;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .tile-badge.count.show{display:inline-flex;}
  .tile-badge.beta{
    padding:3px 6px;
    border-radius:999px;
    background:#d6e6f8;
    color:#1d5fa8;
    letter-spacing:0.02em;
  }

  /* ===== Категории ===== */
  .tags-section{margin-top:32px;}
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .section-head h2{
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--text-muted);
    margin:0;
  }
  .section-head .hint{
    font-size:12px;
    color:var(--text-muted);
  }
  .tag-grid{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tag-grid::-webkit-scrollbar{display:none;}
  .tag-card{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:6px;
    height:40px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:0 14px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s ease, transform .1s ease, opacity .15s ease;
  }
  .tag-card:hover{border-color:var(--border-strong);}
  .tag-card:active{transform:scale(0.97);}
  .tag-card.active{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .tag-card.disabled{
    opacity:0.4;
    cursor:default;
    pointer-events:none;
  }
  .tag-card .tag-name{
    font-size:13px;
    font-weight:600;
    color:var(--text);
  }
  .tag-card .tag-count{
    font-size:12px;
    color:var(--text-muted);
  }
  .tag-card.active .tag-count{color:var(--accent);}

  /* ===== Список ===== */
  .results-section{margin-top:32px;}
  .reset-btn{
    font-size:12px;
    color:var(--accent);
    background:none;
    border:none;
    cursor:pointer;
    font-weight:600;
    display:none;
    padding:6px 0;
  }
  .reset-btn.show{display:inline;}
  .journal-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .journal-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    transition:opacity .15s ease;
  }
  .journal-card.removing{opacity:0;}
  .jc-code{
    font-size:12px;
    font-weight:600;
    color:var(--text-muted);
    margin-bottom:3px;
  }
  .jc-name{
    font-size:15px;
    font-weight:500;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .jc-code mark, .jc-name mark{
    background:#fde68a;
    color:inherit;
    border-radius:3px;
  }
  .jc-tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .jc-tags span{
    font-size:12px;
    color:var(--text-secondary);
    background:var(--bg);
    border-radius:999px;
    padding:2px 9px;
  }
  .jc-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:44px;
    padding:0 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    cursor:pointer;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text);
    transition:border-color .15s ease, opacity .15s ease, transform .1s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn-primary:hover{opacity:0.92;}
  .btn-fill{
    flex:1 1 100%;
    flex-direction:column;
    gap:1px;
  }
  .btn-fill .btn-sub{
    font-size:11px;
    font-weight:500;
    opacity:0.85;
    line-height:1.1;
  }
  .btn-fill .btn-main{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn.disabled{
    opacity:0.5;
    cursor:default;
    pointer-events:none;
  }
  .btn-view{flex:1;}
  .btn-icon{
    width:44px;
    padding:0;
    flex-shrink:0;
    font-size:18px;
  }
  .btn-icon.active{
    background:#fdf7e3;
    border-color:#ecdca0;
  }

  /* Режим «Избранное»: «Заполнить» первая, «Просмотр» — только иконка */
  .favorites-mode .btn-view{
    flex:0 0 44px;
    width:44px;
    padding:0;
  }
  .favorites-mode .btn-view .btn-label{display:none;}

  .empty-state, .loading-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text-muted);
    font-size:14px;
  }

  .site-footer{
    text-align:center;
    margin-top:40px;
    font-size:12px;
    color:var(--text-muted);
    opacity:0.6;
  }

  /* ===== Сканер ===== */
  .scan-modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .scan-modal-overlay.show{display:flex;}
  .scan-modal{
    background:var(--surface);
    border-radius:var(--radius);
    max-width:420px;
    width:100%;
    padding:20px;
  }
  .scan-modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .scan-modal-header h3{
    font-size:15px;
    font-weight:700;
    margin:0;
  }
  .scan-close{
    background:none;
    border:none;
    font-size:20px;
    color:var(--text-muted);
    cursor:pointer;
    line-height:1;
    width:44px;
    height:44px;
    margin:-10px -10px -10px 0;
  }
  .scan-video-wrap{
    position:relative;
    border-radius:10px;
    overflow:hidden;
    background:#000;
    aspect-ratio:1/1;
  }
  .scan-video-wrap video{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .scan-frame{
    position:absolute;
    inset:14%;
    border:2px solid #ffffff;
    border-radius:12px;
    opacity:0.85;
    pointer-events:none;
  }
  .scan-status{
    margin-top:12px;
    font-size:13px;
    color:var(--text-secondary);
    text-align:center;
    min-height:18px;
  }
  .scan-status.error{color:var(--danger);}

  /* ===== Адаптив ===== */
  @media (min-width:600px){
    .scan-btn .scan-label{display:inline;}
    .btn-fill{flex:1 1 0; min-width:0;}
    .jc-actions{flex-wrap:nowrap;}
    .btn-view{flex:0 0 auto;}
    .favorites-mode .btn-view{flex:0 0 44px;}
  }
  @media (max-width:380px){
    .quick-row{grid-template-columns:1fr 1fr;}
    .tile-fav{grid-column:1 / -1;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <img class="logo" src="logo.svg" alt="Hismar Check">
    <h1>Журналы и чек-листы НАССР</h1>
    <p>Найдите нужный документ по категории или через поиск</p>

    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск по названию или коду" autocomplete="off">
      </div>
      <button class="scan-btn" id="scanBtn" type="button" aria-label="Сканировать QR-код">📷<span class="scan-label">QR</span></button>
    </div>
  </header>

  <div class="scan-modal-overlay" id="scanOverlay">
    <div class="scan-modal">
      <div class="scan-modal-header">
        <h3>Сканирование QR-кода</h3>
        <button class="scan-close" id="scanClose" type="button" aria-label="Закрыть">✕</button>
      </div>
      <div class="scan-video-wrap">
        <video id="scanVideo" playsinline muted></video>
        <div class="scan-frame"></div>
      </div>
      <div class="scan-status" id="scanStatus">Наведите камеру на QR-код</div>
    </div>
  </div>

  <div class="quick-row">
    <button class="tile tile-fav" id="favToggle" type="button" aria-pressed="false">
      <span class="tile-icon">⭐</span>
      <span class="tile-text" id="favText">Избранное</span>
      <span class="tile-badge count" id="favBadge">0</span>
    </button>

    <a class="tile tile-master" href="master.html">
      <span class="tile-icon">📊</span>
      <span class="tile-text">Мастер-таблица</span>
    </a>

    <a class="tile tile-sgi" href="sgi.html">
      <span class="tile-icon">🛠️</span>
      <span class="tile-text">Заявки для СГИ</span>
      <span class="tile-badge beta">beta</span>
    </a>
  </div>

  <div class="tags-section">
    <div class="section-head">
      <h2>Категории</h2>
      <span class="hint"></span>
    </div>
    <div class="tag-grid" id="tagGrid"></div>
  </div>

  <div class="results-section">
    <div class="section-head">
      <h2 id="resultsTitle">Все документы</h2>
      <button class="reset-btn" id="resetBtn" type="button">Сбросить фильтр</button>
    </div>
    <div class="journal-list" id="journalList">
      <div class="loading-state">Загрузка...</div>
    </div>
  </div>

  <div class="site-footer">by <a href="https://t.me/hisamost" onclick="return openExternal(this.href)" rel="noopener" style="color:inherit; text-decoration:none;">hisamost</a> &amp; <a href="https://t.me/katekateem" onclick="return openExternal(this.href)" rel="noopener" style="color:inherit; text-decoration:none;">katekateem</a></div>

</div>

<script>
  // Надёжное открытие внешних ссылок (Telegram и т.п.) — на части мобильных
  // браузеров и в установленном PWA обычный target="_blank" иногда "теряется".
  function openExternal(url){
    const win = window.open(url, '_blank');
    if(!win){
      window.location.href = url;
    }
    return false;
  }

  const TAG_ORDER = ["Санитария","АХО","Оборудование","Продукт","Включения","Температурные","Вредители","Учёт","Прочее"];

  let journals = [];
  let activeTags = new Set();
  let favoritesOnly = false;

  const tagGrid = document.getElementById('tagGrid');
  const journalList = document.getElementById('journalList');
  const searchInput = document.getElementById('searchInput');
  const resetBtn = document.getElementById('resetBtn');
  const resultsTitle = document.getElementById('resultsTitle');
  const favToggle = document.getElementById('favToggle');
  const favText = document.getElementById('favText');
  const favBadge = document.getElementById('favBadge');

  fetch('journals.json')
    .then(r => {
      if(!r.ok) throw new Error('network');
      return r.json();
    })
    .then(data => {
      journals = data.map(normalizeTags);
      updateFavBadge();
      renderTags();
      renderList();
    })
    .catch(() => {
      journalList.innerHTML = '<div class="empty-state">Не удалось загрузить journals.json. Проверьте, что файл лежит рядом с index.html.</div>';
    });

  // Единое написание тега «Учёт» (в данных может встречаться «Учет»)
  function normalizeTags(j){
    return Object.assign({}, j, {
      tags: (j.tags || []).map(t => t === 'Учет' ? 'Учёт' : t)
    });
  }

  // Код журнала и название без кода
  function splitName(j){
    const full = j.name || '';
    if(j.id && full.startsWith(j.id)){
      return { code: j.id, title: full.slice(j.id.length).trim() || full };
    }
    return { code: j.id || '', title: full };
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function highlight(text, query){
    const safe = escapeHtml(text);
    if(!query) return safe;
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if(idx === -1) return safe;
    return escapeHtml(text.slice(0, idx))
      + '<mark>' + escapeHtml(text.slice(idx, idx + query.length)) + '</mark>'
      + escapeHtml(text.slice(idx + query.length));
  }

  function updateFavBadge(){
    const validIds = new Set(journals.map(j => j.id));
    const n = getFavorites().filter(id => validIds.has(id)).length;
    favBadge.textContent = n;
    favBadge.classList.toggle('show', n > 0);
  }

  // Фильтр по поиску и избранному (без учёта тегов) — база для счётчиков тегов
  function baseFiltered(){
    const query = searchInput.value.trim().toLowerCase();
    let list = journals;
    if(favoritesOnly) list = list.filter(j => isFavorite(j.id));
    if(query) list = list.filter(j => j.name.toLowerCase().includes(query));
    return list;
  }

  function renderTags(){
    const base = baseFiltered();
    tagGrid.innerHTML = '';

    TAG_ORDER.forEach(tag => {
      const isActive = activeTags.has(tag);

      // Сколько журналов останется, если добавить этот тег к текущему выбору
      const next = new Set(activeTags);
      next.add(tag);
      const count = base.filter(j => Array.from(next).every(t => j.tags.includes(t))).length;

      const disabled = !isActive && count === 0;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tag-card' + (isActive ? ' active' : '') + (disabled ? ' disabled' : '');
      btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      if(disabled) btn.setAttribute('aria-disabled', 'true');
      btn.innerHTML = `<span class="tag-name">${isActive ? '✓ ' : ''}${escapeHtml(tag)}</span><span class="tag-count">(${count})</span>`;
      btn.addEventListener('click', () => {
        if(disabled) return;
        if(isActive) activeTags.delete(tag);
        else activeTags.add(tag);
        renderTags();
        renderList();
      });
      tagGrid.appendChild(btn);
    });
  }

  function fillLink(j){
    // Предзаполненная форма в приоритете, иначе пустая
    if(j.formUrlPrefill) return { url: j.formUrlPrefill, prefilled: true };
    if(j.formUrl) return { url: j.formUrl, prefilled: false };
    return { url: '', prefilled: false };
  }

  function cardHtml(j, query){
    const { code, title } = splitName(j);
    const fill = fillLink(j);
    const fav = isFavorite(j.id);

    const fillBtn = fill.url
      ? `<a class="btn btn-primary btn-fill" href="${escapeHtml(fill.url)}" target="_blank" rel="noopener">
           <span class="btn-main">✏️ Заполнить</span>
           ${fill.prefilled ? '<span class="btn-sub"></span>' : ''}
         </a>`
      : `<span class="btn btn-primary btn-fill disabled" aria-disabled="true">
           <span class="btn-main">✏️ Заполнить</span>
           <span class="btn-sub">форма не подключена</span>
         </span>`;

    return `
      <div class="journal-card" data-id="${escapeHtml(j.id)}">
        <div class="jc-code">${highlight(code, query)}</div>
        <div class="jc-name">${highlight(title, query)}</div>
        <div class="jc-tags">${j.tags.map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>
        <div class="jc-actions">
          ${fillBtn}
          <a class="btn btn-view" href="journal.html?id=${encodeURIComponent(j.id)}" aria-label="Просмотр журнала"><span>👁</span><span class="btn-label">Просмотр</span></a>
          <button class="btn btn-icon${fav ? ' active' : ''}" type="button" data-fav-id="${escapeHtml(j.id)}"
                  aria-label="${fav ? 'Убрать из избранного' : 'Добавить в избранное'}"
                  aria-pressed="${fav ? 'true' : 'false'}">${fav ? '⭐' : '☆'}</button>
        </div>
      </div>
    `;
  }

  function renderList(){
    const query = searchInput.value.trim();
    let filtered = baseFiltered();
    if(activeTags.size > 0){
      filtered = filtered.filter(j => Array.from(activeTags).every(t => j.tags.includes(t)));
    }

    resetBtn.classList.toggle('show', activeTags.size > 0 || !!query || favoritesOnly);
    journalList.classList.toggle('favorites-mode', favoritesOnly);

    if(favoritesOnly){
      resultsTitle.textContent = `⭐ Избранные формы (${filtered.length})`;
    } else {
      resultsTitle.textContent = activeTags.size > 0
        ? `${Array.from(activeTags).join(' + ')} (${filtered.length})`
        : `Все документы (${filtered.length})`;
    }

    if(filtered.length === 0){
      journalList.innerHTML = favoritesOnly
        ? '<div class="empty-state">Пока нет избранных форм. Нажмите ☆ на карточке журнала.</div>'
        : '<div class="empty-state">Ничего не найдено. Попробуйте другой запрос или категорию.</div>';
      return;
    }

    journalList.innerHTML = filtered.map(j => cardHtml(j, query)).join('');
  }

  // Звёздочки: делегирование событий на список
  journalList.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-fav-id]');
    if(!btn) return;

    const id = btn.dataset.favId;
    const nowActive = toggleFavorite(id);
    updateFavBadge();

    if(favoritesOnly && !nowActive){
      // В режиме избранного карточка плавно исчезает
      const card = btn.closest('.journal-card');
      if(card){
        card.classList.add('removing');
        setTimeout(() => { renderTags(); renderList(); }, 150);
        return;
      }
    }

    btn.classList.toggle('active', nowActive);
    btn.textContent = nowActive ? '⭐' : '☆';
    btn.setAttribute('aria-pressed', nowActive ? 'true' : 'false');
    btn.setAttribute('aria-label', nowActive ? 'Убрать из избранного' : 'Добавить в избранное');
  });

  favToggle.addEventListener('click', () => {
    favoritesOnly = !favoritesOnly;
    favToggle.classList.toggle('active', favoritesOnly);
    favToggle.setAttribute('aria-pressed', favoritesOnly ? 'true' : 'false');
    favText.textContent = favoritesOnly ? '✓ Избранное' : 'Избранное';
    renderTags();
    renderList();
  });

  searchInput.addEventListener('input', () => {
    renderTags();
    renderList();
  });

  resetBtn.addEventListener('click', () => {
    activeTags.clear();
    searchInput.value = '';
    favoritesOnly = false;
    favToggle.classList.remove('active');
    favToggle.setAttribute('aria-pressed', 'false');
    favText.textContent = 'Избранное';
    renderTags();
    renderList();
  });

  // Если пользователь вернулся на вкладку (например, из мастер-таблицы) —
  // синхронизируем избранное
  window.addEventListener('pageshow', () => {
    if(journals.length){
      updateFavBadge();
      renderTags();
      renderList();
    }
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // --- Сканирование QR-кода ---
  const scanBtn = document.getElementById('scanBtn');
  const scanOverlay = document.getElementById('scanOverlay');
  const scanClose = document.getElementById('scanClose');
  const scanVideo = document.getElementById('scanVideo');
  const scanStatus = document.getElementById('scanStatus');

  let scanStream = null;
  let scanRAF = null;
  let scanCanvas = null;
  let scanCtx = null;
  let jsQRLoaded = false;
  let barcodeDetector = null;

  scanBtn.addEventListener('click', openScanner);
  scanClose.addEventListener('click', closeScanner);
  scanOverlay.addEventListener('click', (e) => { if(e.target === scanOverlay) closeScanner(); });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && scanOverlay.classList.contains('show')) closeScanner();
  });

  async function openScanner(){
    scanOverlay.classList.add('show');
    scanStatus.textContent = 'Запрашиваем доступ к камере...';
    scanStatus.classList.remove('error');

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      scanStatus.textContent = 'Камера не поддерживается в этом браузере.';
      scanStatus.classList.add('error');
      return;
    }

    try{
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
    } catch(e){
      scanStatus.textContent = 'Нет доступа к камере. Разрешите доступ в настройках браузера.';
      scanStatus.classList.add('error');
      return;
    }

    scanVideo.srcObject = scanStream;
    await scanVideo.play();
    scanStatus.textContent = 'Наведите камеру на QR-код';

    if('BarcodeDetector' in window){
      try{
        barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
        scanLoopNative();
        return;
      } catch(e){
        barcodeDetector = null;
      }
    }

    if(!jsQRLoaded){
      await loadJsQR();
    }
    scanLoopFallback();
  }

  function closeScanner(){
    scanOverlay.classList.remove('show');
    if(scanRAF) cancelAnimationFrame(scanRAF);
    scanRAF = null;
    if(scanStream){
      scanStream.getTracks().forEach(t => t.stop());
      scanStream = null;
    }
    scanVideo.srcObject = null;
  }

  async function scanLoopNative(){
    if(!scanStream) return;
    try{
      const codes = await barcodeDetector.detect(scanVideo);
      if(codes.length > 0){
        handleScanResult(codes[0].rawValue);
        return;
      }
    } catch(e){ /* игнорируем единичные сбои кадра */ }
    scanRAF = requestAnimationFrame(scanLoopNative);
  }

  function scanLoopFallback(){
    if(!scanStream) return;
    if(!scanCanvas){
      scanCanvas = document.createElement('canvas');
      scanCtx = scanCanvas.getContext('2d');
    }
    if(scanVideo.readyState === scanVideo.HAVE_ENOUGH_DATA && window.jsQR){
      scanCanvas.width = scanVideo.videoWidth;
      scanCanvas.height = scanVideo.videoHeight;
      scanCtx.drawImage(scanVideo, 0, 0, scanCanvas.width, scanCanvas.height);
      const imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
      const code = window.jsQR(imageData.data, imageData.width, imageData.height);
      if(code && code.data){
        handleScanResult(code.data);
        return;
      }
    }
    scanRAF = requestAnimationFrame(scanLoopFallback);
  }

  function loadJsQR(){
    return new Promise((resolve) => {
      if(window.jsQR){ jsQRLoaded = true; resolve(); return; }
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
      script.onload = () => { jsQRLoaded = true; resolve(); };
      script.onerror = () => {
        scanStatus.textContent = 'Не удалось загрузить сканер. Проверьте интернет-соединение.';
        scanStatus.classList.add('error');
        resolve();
      };
      document.head.appendChild(script);
    });
  }

  function handleScanResult(rawValue){
    if(scanRAF) cancelAnimationFrame(scanRAF);
    scanRAF = null;

    scanStatus.textContent = 'Код распознан, переходим по ссылке...';
    window.location.href = rawValue;
  }
</script>

</body>
</html>
