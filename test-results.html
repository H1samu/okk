<!DOCTYPE html>
<html lang="ru">
<head>
<script src="auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Результаты тестирования — Hismar Check</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#3a5a52;--bg:#f6f5f1;--line:#e4e2d9}
*{box-sizing:border-box}
body{margin:0;padding:22px;background:var(--bg);font-family:Manrope,Arial,sans-serif;color:#20201c}
.wrap{max-width:1200px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0 0 6px;font-size:22px}
.muted{color:#6b6a61;font-size:13px}
.back-link{display:inline-block;margin-bottom:20px;color:var(--green);font-size:13px;text-decoration:none}
a:focus-visible,button:focus-visible,.table-wrap:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.button{display:inline-flex;align-items:center;min-height:44px;border:0;border-radius:999px;padding:0 16px;background:var(--green);color:#fff;text-decoration:none;font:600 13px Manrope,Arial,sans-serif;cursor:pointer}
.button[hidden]{display:none}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:18px;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:110px;white-space:pre-wrap;overflow-wrap:anywhere}
th{background:#e8efec;color:#20201c;position:sticky;top:0}
th:nth-child(n+5):nth-child(-n+7){min-width:210px}
tr:nth-child(even) td{background:#f7f9f8}
.status{margin:18px 0 12px;color:#6b6a61}
</style>
</head>
<body>
<main class="wrap">
  <a class="back-link" href="index.html">← На главную</a>
  <header class="head">
    <div>
      <h1>Результаты тестирования</h1>
      <div class="muted" id="meta"></div>
    </div>
    <a class="button" id="sheetLink" href="https://docs.google.com/spreadsheets/d/1sNKXxXegeBt8w4rrL_5je_XHvT1eijVMad6LWjkPEgM/edit?gid=377642348#gid=377642348" target="_blank" rel="noopener" hidden>Открыть в Google Таблицах</a>
  </header>
  <p class="status" id="status" role="status">Проверяем права доступа…</p>
  <button class="button" id="retry" type="button" hidden>Повторить загрузку</button>
  <div class="table-wrap" id="tableWrap" tabindex="0" role="region" aria-label="Таблица результатов" hidden>
    <table id="results"></table>
  </div>
</main>
<script>
  const meta = document.getElementById('meta');
  const statusEl = document.getElementById('status');
  const sheetLink = document.getElementById('sheetLink');
  const retry = document.getElementById('retry');
  const tableWrap = document.getElementById('tableWrap');
  const table = document.getElementById('results');

  function checkAccess(){
    if(window.gcheckCanViewTestResults()) return true;
    table.replaceChildren();
    tableWrap.hidden = true;
    sheetLink.hidden = true;
    meta.textContent = '';
    statusEl.hidden = false;
    statusEl.textContent = 'У вашей должности нет доступа к результатам.';
    return false;
  }

  function render(data){
    meta.textContent = 'Всего попыток: ' + data.total;
    sheetLink.hidden = false;
    if(!data.rows.length){
      statusEl.textContent = 'Пока нет сохранённых результатов.';
      return;
    }
    const headerRow = table.createTHead().insertRow();
    for(const title of data.headers){
      const th = document.createElement('th');
      th.scope = 'col';
      th.textContent = title;
      headerRow.append(th);
    }
    const body = table.createTBody();
    for(const row of data.rows){
      const tr = body.insertRow();
      for(const value of row) tr.insertCell().textContent = value;
    }
    tableWrap.hidden = false;
    statusEl.hidden = true;
  }

  async function load(){
    retry.hidden = true;
    if(!checkAccess()) return;
    statusEl.textContent = 'Загружаем результаты…';
    statusEl.hidden = false;
    try{
      const data = await window.gcheckRequest('testGetResults');
      if(checkAccess()) render(data);
    }catch(error){
      if(['invalid', 'expired', 'inactive'].includes(error.message)){
        window.gcheckLogout();
        return;
      }
      if(error.message === 'forbidden'){
        statusEl.textContent = 'У вашей должности нет доступа к результатам.';
        return;
      }
      statusEl.textContent = 'Не удалось загрузить результаты.';
      retry.hidden = false;
    }
  }

  retry.addEventListener('click', load);
  document.addEventListener('gcheck:user', checkAccess);
  load();
</script>
</body>
</html>
