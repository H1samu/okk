<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест — Hismar Check</title><script src="auth-guard.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--green:#3a5a52;--bg:#f6f5f1;--text:#20201c;--muted:#6b6a61;--line:#e4e2d9}*{box-sizing:border-box}body{margin:0;padding:24px 14px 48px;background:var(--bg);font-family:Manrope,Arial,sans-serif;color:var(--text)}.wrap{max-width:820px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:14px;box-shadow:0 1px 2px #0000000b}h1{font-size:23px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.progress-line{height:7px;background:#e8efec;border-radius:20px;overflow:hidden;margin-top:16px}.progress{height:100%;width:0;background:var(--green);transition:width .2s}.block{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--green);margin-bottom:8px}.question{font-size:17px;line-height:1.45;font-weight:600;margin-bottom:14px}.option{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:var(--green);background:#e8efec}.option input{accent-color:var(--green);margin-top:3px}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.counter{font-size:13px;color:var(--muted)}button,.link{border:0;border-radius:9px;background:var(--green);color:#fff;padding:13px 20px;font:600 14px Manrope,Arial;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:wait}.error{display:none;color:#a22;font-size:13px;margin-top:12px}.hidden{display:none!important}.result{text-align:center;padding:32px 20px}.score{font-size:36px;font-weight:700}.grade{font-size:19px;font-weight:700;margin:10px 0}.employee{font-size:14px;color:var(--muted)}.gauge{width:min(290px,100%);height:154px;margin:14px auto 0;position:relative}.gauge svg{display:block;width:100%;height:100%;overflow:visible}.gauge-track,.gauge-value{fill:none;stroke-width:15;stroke-linecap:round}.gauge-track{stroke:#eceeea}.gauge-value{stroke:url(#scoreGradient);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset .8s cubic-bezier(.2,.75,.25,1)}.attempts{display:inline-block;font-size:12px;color:var(--muted);background:#f1f2ee;border-radius:999px;padding:7px 12px;margin:12px 0}.limit-message{font-size:14px;color:#a22;font-weight:600;margin:14px 0}.back-link{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;padding:12px 18px;border:1px solid var(--line);border-radius:9px;color:var(--green);background:#fff;text-decoration:none;font-size:14px;font-weight:600}.back-link:hover{background:#f4f7f5;border-color:var(--green)}.result .score{font-size:38px;letter-spacing:-.04em;margin-top:-3px}.result .grade{margin:8px 0 4px}@media(max-width:560px){body{padding:12px 9px 30px}.card{padding:19px 15px}.actions{align-items:stretch;flex-direction:column-reverse}button{width:100%}.counter{text-align:center}}
</style></head><body><div class="wrap"><section class="card" id="headerCard"><h1>Тест: Санитарные нормы и производственные процедуры</h1><div class="muted" id="employeeName"></div><div class="progress-line"><div class="progress" id="progress"></div></div></section><div class="card muted" id="loading">Загружаем ваш вариант теста…</div><main id="quiz" class="hidden"><div id="questions"></div><section class="card"><div class="actions"><span class="counter" id="counter">Отвечено: 0 из 10</span><button id="submitBtn" type="button">Завершить тест</button></div><div class="error" id="error"></div></section></main><section class="card result hidden" id="resultCard"><div class="muted">ТЕСТ ЗАВЕРШЁН</div><div class="gauge"><svg viewBox="0 0 260 150" role="img" aria-label="Индикатор результата"><defs><linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#c65a4c"/><stop offset="52%" stop-color="#d7ad43"/><stop offset="100%" stop-color="#3a8a68"/></linearGradient></defs><path class="gauge-track" d="M22 128 A108 108 0 0 1 238 128"/><path class="gauge-value" id="gaugeValue" d="M22 128 A108 108 0 0 1 238 128"/></svg></div><div class="score" id="scoreText">0 из 10</div><div class="grade" id="gradeText"></div><div class="attempts" id="attemptsText"></div><div class="limit-message hidden" id="limitMessage">Вы исчерпали попытки, запросите сброс результатов у администраторов</div><div class="employee" id="employeeText"></div><p class="muted">Результат сохранён.</p><a class="link hidden" id="adminLink" href="test-results.html">Открыть результаты тестирования</a><p><button id="retryBtn" type="button">Пройти заново</button></p><a class="back-link" href="index.html">← Вернуться к журналам</a></section></div><script>
const API='https://script.google.com/macros/s/AKfycbw65iyi4m1X3Bu1KIrcJwiQCnqQ83odteQc2MtEYnkEjHCiVqQV6sIVwJoUYrCQFR2ALQ/exec';
const auth=(()=>{try{return JSON.parse(localStorage.getItem('gcheck_auth')||'null')}catch(e){return null}})();
const SESSION_KEY='hismar_test_session_v1';function makeSessionId(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}let sessionId=sessionStorage.getItem(SESSION_KEY);if(!sessionId){sessionId=makeSessionId();sessionStorage.setItem(SESSION_KEY,sessionId)}let attemptMeta={attemptsUsed:0,maxAttempts:3};
let questions=[],answers={};const $=id=>document.getElementById(id);
async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:auth.token,...extra})});const d=await r.json();if(!d||!d.ok)throw new Error(d&&d.error||'Ошибка сервера');return d}
function showError(message){$('loading').textContent=message}function updateAttemptMeta(data){attemptMeta.attemptsUsed=Number(data.attemptsUsed||attemptMeta.attemptsUsed||0);attemptMeta.maxAttempts=Number(data.maxAttempts||3)}
async function init(){if(!auth||!auth.token){showError('Сначала войдите в Hismar Check.');return}$('employeeName').textContent=auth.name||'';try{const data=await api('testGetQuiz',{sessionId});updateAttemptMeta(data);$('loading').classList.add('hidden');if(data.completed){showResult(data.result,data);return}renderQuestions(data);}catch(e){showError(e.message||'Не удалось загрузить тест.')}}
function renderQuestions(data){updateAttemptMeta(data);questions=data.questions;answers={};$('headerCard').classList.remove('hidden');$('resultCard').classList.add('hidden');$('loading').classList.add('hidden');$('quiz').classList.remove('hidden');$('submitBtn').disabled=false;$('submitBtn').textContent='Завершить тест';const root=$('questions');root.innerHTML='';questions.forEach((q,i)=>{const section=document.createElement('section');section.className='card';const title=document.createElement('div');title.className='question';title.textContent=(i+1)+'. '+q.question;section.append(title);q.answers.forEach((answer,j)=>{const label=document.createElement('label');label.className='option';const radio=document.createElement('input');radio.type='radio';radio.name=q.id;radio.value=j;radio.addEventListener('change',()=>{answers[q.id]=j;section.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));label.classList.add('selected');updateProgress()});const span=document.createElement('span');span.textContent=String.fromCharCode(97+j)+') '+answer;label.append(radio,span);section.append(label)});root.append(section)});updateProgress()}
function updateProgress(){const n=Object.keys(answers).length;$('counter').textContent='Отвечено: '+n+' из 10';$('progress').style.width=(n*10)+'%';$('error').style.display='none'}
$('submitBtn').addEventListener('click',async()=>{if(Object.keys(answers).length!==10){$('error').textContent='Ответьте на все 10 вопросов перед завершением теста.';$('error').style.display='block';return}const btn=$('submitBtn');btn.disabled=true;btn.textContent='Отправляем…';try{const data=await api('testSubmit',{sessionId,answers});showResult(data.result,data)}catch(e){btn.disabled=false;btn.textContent='Завершить тест';$('error').textContent=e.message||'Не удалось сохранить результат.';$('error').style.display='block'}});
function showResult(result,meta={}){updateAttemptMeta(meta);$('headerCard').classList.add('hidden');$('quiz').classList.add('hidden');$('loading').classList.add('hidden');$('resultCard').classList.remove('hidden');$('scoreText').textContent=result.score+' из '+result.total;$('gradeText').textContent=result.grade;$('gradeText').style.color=result.color;$('employeeText').textContent=result.employeeName;const pct=Math.max(0,Math.min(100,Number(result.score||0)/Math.max(1,Number(result.total||10))*100));$('gaugeValue').style.strokeDashoffset=(339.3*(1-pct/100)).toFixed(1);$('attemptsText').textContent='Попыток использовано '+attemptMeta.attemptsUsed+' из '+attemptMeta.maxAttempts;$('retryBtn').classList.toggle('hidden',attemptMeta.attemptsUsed>=attemptMeta.maxAttempts);$('limitMessage').classList.toggle('hidden',attemptMeta.attemptsUsed<attemptMeta.maxAttempts);$('adminLink').classList.toggle('hidden',!window.gcheckCanViewTestResults())}
$('retryBtn').addEventListener('click',async()=>{const btn=$('retryBtn');btn.disabled=true;btn.textContent='Загружаем…';sessionId=makeSessionId();sessionStorage.setItem(SESSION_KEY,sessionId);try{const data=await api('testGetQuiz',{sessionId,newAttempt:true});updateAttemptMeta(data);if(data.completed){showResult(data.result,data);return}if(!Array.isArray(data.questions)||!data.questions.length)throw new Error('Сервер не вернул вопросы теста. Обновите страницу и попробуйте ещё раз.');renderQuestions(data)}catch(e){if(e.message==='attempts_exhausted'){$('retryBtn').classList.add('hidden');$('limitMessage').classList.remove('hidden');$('attemptsText').textContent='Попыток использовано '+attemptMeta.maxAttempts+' из '+attemptMeta.maxAttempts}else{alert(e.message||'Не удалось начать новую попытку')}btn.disabled=false;btn.textContent='Пройти заново'}});document.addEventListener('gcheck:user',()=>{$('adminLink').classList.toggle('hidden',!window.gcheckCanViewTestResults())});init();
</script></body></html>
