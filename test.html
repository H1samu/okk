<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест — Hismar Check</title><script src="auth-guard.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--green:#3a5a52;--bg:#f6f5f1;--text:#20201c;--muted:#6b6a61;--line:#e4e2d9}*{box-sizing:border-box}body{margin:0;padding:24px 14px 48px;background:var(--bg);font-family:Manrope,Arial,sans-serif;color:var(--text)}.wrap{max-width:820px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:14px;box-shadow:0 1px 2px #0000000b}h1{font-size:23px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.progress-line{height:7px;background:#e8efec;border-radius:20px;overflow:hidden;margin-top:16px}.progress{height:100%;width:0;background:var(--green);transition:width .2s}.block{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--green);margin-bottom:8px}.question{font-size:17px;line-height:1.45;font-weight:600;margin-bottom:14px}.option{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;line-height:1.4}.option.selected{border-color:var(--green);background:#e8efec}.option input{accent-color:var(--green);margin-top:3px}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.counter{font-size:13px;color:var(--muted)}button,.link{border:0;border-radius:9px;background:var(--green);color:#fff;padding:13px 20px;font:600 14px Manrope,Arial;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5;cursor:wait}.error{display:none;color:#a22;font-size:13px;margin-top:12px}.hidden{display:none!important}.result{text-align:center;padding:32px 20px}.score{font-size:36px;font-weight:700}.grade{font-size:19px;font-weight:700;margin:10px 0}.employee{font-size:14px;color:var(--muted)}.gauge{position:relative;width:230px;height:124px;margin:18px auto 8px;overflow:hidden}.gauge-arc{position:absolute;inset:0;border-radius:230px 230px 0 0;background:conic-gradient(from 270deg at 50% 100%,#b33a32 0deg,#b07822 65deg,#d2b43c 115deg,#3a5a52 150deg,#27834a 180deg,transparent 180deg);}.gauge-arc:after{content:'';position:absolute;inset:16px 16px 0;border-radius:214px 214px 0 0;background:#fff}.gauge-needle{position:absolute;width:4px;height:88px;background:#20201c;left:calc(50% - 2px);bottom:0;transform-origin:50% 100%;transform:rotate(-90deg);border-radius:4px;z-index:2;transition:transform .5s}.gauge-hub{position:absolute;width:14px;height:14px;border-radius:50%;background:#20201c;left:calc(50% - 7px);bottom:-1px;z-index:3}.attempts{font-size:13px;color:var(--muted);margin:8px 0}.limit-message{font-size:14px;color:#a22;font-weight:600;margin:14px 0}@media(max-width:560px){body{padding:12px 9px 30px}.card{padding:19px 15px}.actions{align-items:stretch;flex-direction:column-reverse}button{width:100%}.counter{text-align:center}}
</style></head><body><div class="wrap"><section class="card" id="headerCard"><h1>Тест: Санитарные нормы и производственные процедуры</h1><div class="muted" id="employeeName"></div><div class="progress-line"><div class="progress" id="progress"></div></div></section><div class="card muted" id="loading">Загружаем ваш вариант теста…</div><main id="quiz" class="hidden"><div id="questions"></div><section class="card"><div class="actions"><span class="counter" id="counter">Отвечено: 0 из 10</span><button id="submitBtn" type="button">Завершить тест</button></div><div class="error" id="error"></div></section></main><section class="card result hidden" id="resultCard"><div class="muted">ТЕСТ ЗАВЕРШЁН</div><div class="gauge"><div class="gauge-arc"></div><div class="gauge-needle" id="gaugeNeedle"></div><div class="gauge-hub"></div></div><div class="score" id="scoreText">0 из 10</div><div class="grade" id="gradeText"></div><div class="attempts" id="attemptsText"></div><div class="limit-message hidden" id="limitMessage">Вы исчерпали попытки, запросите сброс результатов у администраторов</div><div class="employee" id="employeeText"></div><p class="muted">Результат сохранён.</p><a class="link hidden" id="adminLink" href="test-results.html">Открыть результаты тестирования</a><p><button id="retryBtn" type="button">Пройти заново</button></p></section></div><script>
const API='https://script.google.com/macros/s/AKfycbw65iyi4m1X3Bu1KIrcJwiQCnqQ83odteQc2MtEYnkEjHCiVqQV6sIVwJoUYrCQFR2ALQ/exec';
const auth=(()=>{try{return JSON.parse(localStorage.getItem('gcheck_auth')||'null')}catch(e){return null}})();
const SESSION_KEY='hismar_test_session_v1';function makeSessionId(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}let sessionId=sessionStorage.getItem(SESSION_KEY);if(!sessionId){sessionId=makeSessionId();sessionStorage.setItem(SESSION_KEY,sessionId)}let attemptMeta={attemptsUsed:0,maxAttempts:3};
let questions=[],answers={};const $=id=>document.getElementById(id);
async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:auth.token,...extra})});const d=await r.json();if(!d||!d.ok)throw new Error(d&&d.error||'Ошибка сервера');return d}
function showError(message){$('loading').textContent=message}function updateAttemptMeta(data){attemptMeta.attemptsUsed=Number(data.attemptsUsed||attemptMeta.attemptsUsed||0);attemptMeta.maxAttempts=Number(data.maxAttempts||3)}
async function init(){if(!auth||!auth.token){showError('Сначала войдите в Hismar Check.');return}$('employeeName').textContent=auth.name||'';try{const data=await api('testGetQuiz',{sessionId});updateAttemptMeta(data);$('loading').classList.add('hidden');if(data.completed){showResult(data.result,data);return}renderQuestions(data);renderQuestions(data);}catch(e){showError(e.message||'Не удалось загрузить тест.')}}
function updateProgress(){const n=Object.keys(answers).length;$('counter').textContent='Отвечено: '+n+' из 10';$('progress').style.width=(n*10)+'%';$('error').style.display='none'}
$('submitBtn').addEventListener('click',async()=>{if(Object.keys(answers).length!==10){$('error').textContent='Ответьте на все 10 вопросов перед завершением теста.';$('error').style.display='block';return}const btn=$('submitBtn');btn.disabled=true;btn.textContent='Отправляем…';try{const data=await api('testSubmit',{sessionId,answers});showResult(data.result)}catch(e){btn.disabled=false;btn.textContent='Завершить тест';$('error').textContent=e.message||'Не удалось сохранить результат.';$('error').style.display='block'}});
function showResult(result,meta={}){updateAttemptMeta(meta);$('headerCard').classList.add('hidden');$('quiz').classList.add('hidden');$('loading').classList.add('hidden');$('resultCard').classList.remove('hidden');$('scoreText').textContent=result.score+' из '+result.total;$('gradeText').textContent=result.grade;$('gradeText').style.color=result.color;$('employeeText').textContent=result.employeeName;const pct=Math.max(0,Math.min(100,Number(result.score||0)/Math.max(1,Number(result.total||10))*100));$('gaugeNeedle').style.transform='rotate('+(-90+pct*1.8)+'deg)';$('attemptsText').textContent='Попытка '+(result.attemptNo||attemptMeta.attemptsUsed)+' из '+attemptMeta.maxAttempts+' · использовано '+attemptMeta.attemptsUsed+' из '+attemptMeta.maxAttempts;$('retryBtn').classList.toggle('hidden',attemptMeta.attemptsUsed>=attemptMeta.maxAttempts);$('limitMessage').classList.toggle('hidden',attemptMeta.attemptsUsed<attemptMeta.maxAttempts);if(String(auth.type||'').trim().toLowerCase()==='администратор')$('adminLink').classList.remove('hidden')}
$('retryBtn').addEventListener('click',async()=>{const btn=$('retryBtn');btn.disabled=true;btn.textContent='Загружаем…';sessionId=makeSessionId();sessionStorage.setItem(SESSION_KEY,sessionId);try{const data=await api('testGetQuiz',{sessionId,newAttempt:true});updateAttemptMeta(data);if(data.completed){showResult(data.result,data);return}renderQuestions(data)}catch(e){if(e.message==='attempts_exhausted'||e.message==='Вы исчерпали попытки, запросите сброс результатов у администраторов'){$('retryBtn').classList.add('hidden');$('limitMessage').classList.remove('hidden');$('attemptsText').textContent='Использовано '+attemptMeta.maxAttempts+' из '+attemptMeta.maxAttempts+' попыток'}else{alert(e.message||'Не удалось начать новую попытку')}btn.disabled=false;btn.textContent='Пройти заново'}});init();
</script></body></html>
