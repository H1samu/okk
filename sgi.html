<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки для СГИ</title>
<script src="auth-guard.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;
    --surface:#ffffff;
    --border:#e4e2d9;
    --border-strong:#c9c6b8;
    --text:#20201c;
    --text-secondary:#6b6a61;
    --text-muted:#98968a;
    --accent:#3a5a52;
    --accent-soft:#e8efec;
    --danger:#9c3b34;
    --danger-soft:#fbebe9;
    --radius:12px;

    /* Цвета статусов (мягкие) */
    --st-red-text:#a3463f;   --st-red-bg:#fbe9e7;   --st-red-border:#ebc4c0;   --st-red-row:#fdf4f3;   --st-red-bar:#e0928b;
    --st-yel-text:#8a6416;   --st-yel-bg:#fdf3d8;   --st-yel-border:#ecd9ab;   --st-yel-row:#fffaec;   --st-yel-bar:#e3c06a;
    --st-grn-text:#2f7a3e;   --st-grn-bg:#e8f5ea;   --st-grn-border:#c3e2cb;   --st-grn-row:#f3faf4;   --st-grn-bar:#8fc79b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body.resizing{cursor:col-resize; user-select:none;}
  .wrap{
    max-width:1200px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--text-secondary);
    text-decoration:none;
    margin-bottom:20px;
  }
  .back-link:hover{color:var(--accent);}
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .header-text h1{
    font-size:22px;
    font-weight:700;
    margin:0 0 6px;
  }
  header p{
    font-size:13px;
    color:var(--text-secondary);
    margin:0;
  }
  .user-badge{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    color:var(--text-muted);
    margin-top:8px;
  }
  .user-badge b{color:var(--text-secondary);}
  .ext-links{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .ext-links a, .ext-links button{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    color:var(--accent);
    background:var(--accent-soft);
    border:1px solid var(--border);
    border-radius:999px;
    padding:8px 14px;
    font-family:inherit;
    cursor:pointer;
  }
  .ext-links a:hover, .ext-links button:hover{border-color:var(--border-strong);}
  .ext-links .create-btn{
    color:#fff;
    background:var(--accent);
    border-color:var(--accent);
  }
  .ext-links .create-btn:hover{opacity:0.92; border-color:var(--accent);}
  .ext-links .tg-btn{
    color:#1d5fa8;
    background:#eaf2fc;
    border-color:#bcd6f0;
  }
  .ext-links .tg-btn:hover{border-color:#93bce4;}

  .toolbar{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:20px 0 18px;
  }
  .search-box{
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:11px 16px 11px 40px;
    border:1px solid var(--border-strong);
    border-radius:999px;
    font-size:14px;
    font-family:inherit;
    background:var(--surface);
    color:var(--text);
  }
  .search-box input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .search-box svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    stroke:var(--text-muted);
  }

  /* ==== Фильтры: статус (выпадающий список) + даты ==== */
  .filters-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .filter-select{
    position:relative;
    flex-shrink:0;
  }
  .filter-select select{
    appearance:none;
    -webkit-appearance:none;
    height:38px;
    padding:0 34px 0 14px;
    border:1px solid var(--border-strong);
    border-radius:999px;
    background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2398968a' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 14px center;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
    max-width:100%;
  }
  .filter-select select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .filter-select.has-value select{
    border-color:var(--accent);
    background-color:var(--accent-soft);
    color:var(--accent);
  }
  .filters-sep{
    width:1px;
    height:22px;
    background:var(--border-strong);
    flex-shrink:0;
  }
  .date-chips{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .date-chip{
    height:38px;
    padding:0 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .date-chip:hover{border-color:var(--border-strong);}
  .date-chip.active{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }
  .range-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .range-wrap[hidden]{display:none;}
  .range-wrap input[type=date]{
    height:38px;
    padding:0 10px;
    border:1px solid var(--border-strong);
    border-radius:10px;
    font-family:inherit;
    font-size:13px;
    background:var(--surface);
    color:var(--text);
  }
  .range-wrap input[type=date]:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .range-wrap .dash{color:var(--text-muted);}
  .reset-filters{
    display:none;
    background:none;
    border:none;
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    color:var(--accent);
    cursor:pointer;
    padding:6px 4px;
  }
  .reset-filters.show{display:inline;}

  .row-count{
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:12px;
  }

  .state-box{
    text-align:center;
    padding:50px 20px;
    color:var(--text-muted);
    font-size:14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .state-box.error{
    color:var(--danger);
    background:var(--danger-soft);
    border-color:transparent;
  }

  /* ==== Таблица ==== */
  .table-scroll{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:auto;
    max-width:100%;
  }
  table{
    border-collapse:collapse;
    table-layout:fixed;
    font-size:13px;
    min-width:100%;
  }
  thead th{
    position:sticky;
    top:0;
    background:var(--accent-soft);
    color:var(--text);
    text-align:left;
    padding:10px 14px;
    font-weight:600;
    border-bottom:1px solid var(--border-strong);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  th.sortable{
    cursor:pointer;
    user-select:none;
  }
  th.sortable:hover{background:#dfe9e5;}
  th .sort-arrow{
    display:inline-block;
    margin-left:4px;
    color:var(--text-muted);
    font-size:11px;
  }
  th.sort-active .sort-arrow{color:var(--accent);}
  th .col-resizer{
    position:absolute;
    top:0;
    right:0;
    width:10px;
    height:100%;
    cursor:col-resize;
    touch-action:none;
    user-select:none;
  }
  th .col-resizer::after{
    content:'';
    position:absolute;
    top:20%;
    bottom:20%;
    right:4px;
    width:2px;
    background:var(--border-strong);
    border-radius:1px;
  }
  th .col-resizer:hover::after,
  th .col-resizer.active::after{background:var(--accent);}

  tbody td{
    padding:9px 14px;
    border-bottom:1px solid var(--border);
    color:var(--text-secondary);
    vertical-align:middle;
    overflow:hidden;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:#fbfaf7;}

  /* Подсветка строк по статусу */
  tbody tr.row-open td{background:var(--st-red-row);}
  tbody tr.row-progress td{background:var(--st-yel-row);}
  tbody tr.row-done td{background:var(--st-grn-row);}
  tbody tr.row-open:hover td{background:#fbeae8;}
  tbody tr.row-progress:hover td{background:#fff4d6;}
  tbody tr.row-done:hover td{background:#e9f6ec;}
  tbody tr.row-open td:first-child{box-shadow:inset 3px 0 0 var(--st-red-bar);}
  tbody tr.row-progress td:first-child{box-shadow:inset 3px 0 0 var(--st-yel-bar);}
  tbody tr.row-done td:first-child{box-shadow:inset 3px 0 0 var(--st-grn-bar);}

  td.name-cell{
    color:var(--text);
    font-weight:500;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:anywhere;
  }
  td.equipment-cell{
    white-space:normal;
    word-break:break-word;
    overflow-wrap:anywhere;
  }
  td.nowrap-cell{white-space:nowrap; text-overflow:ellipsis;}
  td.status-cell{overflow:visible;}

  .cell-muted{color:var(--text-muted); font-size:12px; white-space:nowrap; text-overflow:ellipsis;}

  /* ==== Кастомный выбор статуса (с переносом текста) ==== */
  .status-picker{
    position:relative;
    width:100%;
  }
  .status-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    width:100%;
    min-width:0;
    padding:7px 10px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    line-height:1.3;
    text-align:left;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
    cursor:pointer;
    background:var(--surface);
    color:var(--text);
  }
  .status-btn .status-label{
    min-width:0;
    flex:1 1 auto;
  }
  .status-btn .chev{
    flex-shrink:0;
    font-size:10px;
    opacity:0.7;
  }
  .status-btn:disabled{opacity:0.5; cursor:wait;}
  .status-btn.s-open{ color:var(--st-red-text); border-color:var(--st-red-border); background:var(--st-red-bg); }
  .status-btn.s-inprogress{ color:var(--st-yel-text); border-color:var(--st-yel-border); background:var(--st-yel-bg); }
  .status-btn.s-done{ color:var(--st-grn-text); border-color:var(--st-grn-border); background:var(--st-grn-bg); }
  .status-btn.s-doneclean{ color:var(--st-grn-text); border-color:var(--st-grn-border); background:var(--st-grn-bg); }
  .status-btn.static{cursor:default;}
  .status-btn.static .chev{display:none;}

  .status-menu{
    display:none;
    position:absolute;
    top:calc(100% + 4px);
    left:0;
    right:0;
    z-index:20;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,0.12);
    overflow:hidden;
  }
  .status-menu.show{display:block;}
  .status-menu.up{top:auto; bottom:calc(100% + 4px);}
  .status-option{
    display:block;
    width:100%;
    padding:8px 10px;
    border:none;
    background:var(--surface);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    line-height:1.3;
    text-align:left;
    white-space:normal;
    color:var(--text);
    cursor:pointer;
  }
  .status-option + .status-option{border-top:1px solid var(--border);}
  .status-option:hover{background:var(--accent-soft);}

  .save-error{
    font-size:11px;
    color:var(--danger);
    margin-top:4px;
    white-space:normal;
  }

  /* ==== Модальное окно создания заявки ==== */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--surface);
    border-radius:var(--radius);
    max-width:440px;
    width:100%;
    padding:24px;
    max-height:90vh;
    overflow:auto;
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .modal-header h3{
    font-size:16px;
    font-weight:700;
    margin:0;
  }
  .modal-close{
    background:none;
    border:none;
    font-size:20px;
    color:var(--text-muted);
    cursor:pointer;
    line-height:1;
    padding:4px;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--text-secondary);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:var(--bg);
    color:var(--text);
  }
  .field input:focus, .field select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .modal-submit{
    width:100%;
    padding:13px 16px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    margin-top:6px;
  }
  .modal-submit:hover{opacity:0.92;}
  .modal-submit:disabled{opacity:0.6; cursor:wait;}
  .modal-error{
    font-size:13px;
    color:var(--danger);
    background:var(--danger-soft);
    border-radius:8px;
    padding:9px 12px;
    margin-bottom:14px;
    display:none;
  }
  .modal-error.show{display:block;}
  .modal-success{
    font-size:13px;
    color:var(--accent);
    background:var(--accent-soft);
    border-radius:8px;
    padding:9px 12px;
    margin-bottom:14px;
    display:none;
  }
  .modal-success.show{display:block;}
  .photo-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    font-weight:600;
    color:var(--accent);
    background:var(--accent-soft);
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 10px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
  }
  .photo-link:hover{border-color:var(--border-strong);}
</style>
</head>
<body>

<div class="wrap">
  <a class="back-link" href="index.html">← Все журналы</a>

  <header>
    <div class="header-text">
      <h1>Заявки для СГИ</h1>
      <div class="user-badge">
        Вы вошли как: <b id="currentUserName">—</b>
      </div>
    </div>
  </header>

  <div class="ext-links">
    <a href="#" id="sheetLink" target="_blank" rel="noopener">📊 Открыть таблицу</a>
    <a class="tg-btn" href="https://t.me/hismar_bot" onclick="return openExternal(this.href)" rel="noopener">✈️ Создать заявку через Telegram</a>
    <button class="create-btn" id="openCreateModal" type="button">➕ Создать заявку</button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Поиск заявки" autocomplete="off">
    </div>

    <div class="filters-row">
      <div class="filter-select" id="statusFilterWrap">
        <select id="statusSelect" aria-label="Фильтр по статусу">
          <option value="">Все статусы</option>
        </select>
      </div>
      <span class="filters-sep" aria-hidden="true"></span>
      <div class="date-chips" id="dateChips" role="group" aria-label="Фильтр по дате создания">
        <button type="button" class="date-chip active" data-d="all">Все даты</button>
        <button type="button" class="date-chip" data-d="today">Сегодня</button>
        <button type="button" class="date-chip" data-d="yesterday">Вчера</button>
        <button type="button" class="date-chip" data-d="range">📅 Период</button>
      </div>
      <div class="range-wrap" id="rangeWrap" hidden>
        <input type="date" id="dateFrom" aria-label="С даты">
        <span class="dash">—</span>
        <input type="date" id="dateTo" aria-label="По дату">
      </div>
      <button type="button" class="reset-filters" id="resetFilters">Сбросить фильтры</button>
    </div>
  </div>

  <div class="row-count" id="rowCount"></div>

  <div id="content">
    <div class="state-box" id="stateBox">Загрузка данных…</div>
  </div>
</div>

<!-- Модальное окно создания заявки -->
<div class="modal-overlay" id="createOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>Новая заявка для СГИ</h3>
      <button class="modal-close" id="createClose" type="button" aria-label="Закрыть">✕</button>
    </div>

    <div class="modal-error" id="createError"></div>
    <div class="modal-success" id="createSuccess">Заявка успешно создана ✓</div>

    <form id="createForm">
      <div class="field">
        <label for="fieldName">Краткое описание заявки</label>
        <input type="text" id="fieldName" required autocomplete="off">
      </div>
      <div class="field">
        <label for="fieldArea">Участок</label>
        <select id="fieldArea" required></select>
      </div>
      <div class="field">
        <label for="fieldEqType">Выберите тип оборудования</label>
        <select id="fieldEqType" required></select>
      </div>
      <div class="field">
        <label for="fieldEquipment">Оборудование</label>
        <input type="text" id="fieldEquipment" required autocomplete="off">
      </div>
      <div class="field">
        <label for="fieldPhoto">Фото (необязательно)</label>
        <input type="file" id="fieldPhoto" accept="image/*" capture="environment">
        <div id="photoPreviewWrap" style="margin-top:8px; display:none;">
          <img id="photoPreview" style="max-width:100%; max-height:160px; border-radius:8px; border:1px solid var(--border);">
          <button type="button" id="photoRemove" style="margin-top:6px; font-size:12px; color:var(--danger); background:none; border:none; cursor:pointer; font-family:inherit;">✕ Убрать фото</button>
        </div>
      </div>
      <button type="submit" class="modal-submit" id="createSubmit">Отправить заявку</button>
    </form>
  </div>
</div>

<div class="modal-overlay" id="photoOverlay">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <h3 id="photoTitle">Фото</h3>
      <button class="modal-close" id="photoClose" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div style="width:100%; border-radius:10px; overflow:hidden; background:var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; min-height:200px;">
      <img id="photoModalImg" style="width:100%; height:auto; display:block;" alt="Фото заявки">
    </div>
  </div>
</div>

<script>
  // ==== НАСТРОЙКИ ====

  function openExternal(url){
    const win = window.open(url, '_blank');
    if(!win){ window.location.href = url; }
    return false;
  }

  // API-ключ Google Sheets API (тот же, что в journal.html/master.html)
  const API_KEY = 'AIzaSyCrXcA6Rzohxe0bWBD3W8veWLprb47m2lY';

  // ID таблицы "Заявки для СГИ" и название листа с заявками
  const SHEET_ID = '1hj5v7Gcz5usvdb40QyDJSnpUNtxnjfiw35ISt-g-cSU';
  const SHEET_NAME = 'Ответы на форму (1)';

  // Ссылка для кнопки "Открыть таблицу"
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1hj5v7Gcz5usvdb40QyDJSnpUNtxnjfiw35ISt-g-cSU/edit?gid=1339045562#gid=1339045562';

  // URL опубликованного Apps Script Web App СГИ (заканчивается на /exec)
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZIvCHbIKEoj-AhrEa7hNJn5bChBNt8bxPoyoNcX5dEpT1ACRodRkMvfIzYfzMLVAr/exec';

  // ==== Статусы ====
  const STATUSES = [
    'Открыта',
    'В работе',
    'Выполнена',
    'Выполнена. Проведена мойка и дезинфекция'
  ];

  const STATUS_CLASS = {
    'Открыта': 's-open',
    'В работе': 's-inprogress',
    'Выполнена': 's-done',
    'Выполнена. Проведена мойка и дезинфекция': 's-doneclean'
  };

  // Класс подсветки всей строки таблицы
  const ROW_CLASS = {
    'Открыта': 'row-open',
    'В работе': 'row-progress',
    'Выполнена': 'row-done',
    'Выполнена. Проведена мойка и дезинфекция': 'row-done'
  };

  // Разрешённые переходы (должны совпадать с ALLOWED_TRANSITIONS в Apps Script).
  // Из выполненных статусов можно вернуться только в "В работе".
  const ALLOWED_TRANSITIONS = {
    'Открыта': ['В работе'],
    'В работе': ['Открыта', 'Выполнена', 'Выполнена. Проведена мойка и дезинфекция'],
    'Выполнена': ['В работе'],
    'Выполнена. Проведена мойка и дезинфекция': ['В работе']
  };

  // ==== Участки для выпадающего списка в форме создания заявки ====
  const AREAS = [
    'RND', 'АХО', 'Бухгалтерия', 'Горячий цех',
    'Комната начальников цехов', 'Комната технологов', 'Котломойка',
    'Мясной цех', 'Овощной цех', 'Опенспейс', 'Отдел контроля качества',
    'Склад готовой продукции', 'Склад сухих компонентов', 'Склад сырья',
    'Столовая', 'Холодный цех', 'Цех сборки', 'Цех упаковки', 'Цех фасовки', 'Другое'
  ];

  // ==== Типы оборудования (должны совпадать с EQUIPMENT_TYPES в Apps Script) ====
  const EQUIPMENT_TYPES = [
    'Компьютеры и принтеры',
    'Механизированное',
    'Тепловой обработки',
    'Холодильное',
    'Стерилизации, сан. пропуска, инсектицидное',
    'Сантехническое',
    'Фасовочное, упаковочное, дозирующее',
    'Производственный и хоз. инвентарь',
    'Здания, помещения, территория'
  ];

  // ==== Ширины столбцов (можно менять перетаскиванием края заголовка) ====
  // Ключ с суффиксом _v3: изменился порядок столбцов ("Статус" теперь вторым),
  // старые сохранённые ширины не подходят.
  const COL_WIDTHS_KEY = 'gcheck_sgi_col_widths_v3';
  // Порядок: Дата создания, Статус, Наименование, Участок, Тип оборудования, Оборудование, Заявитель, Взято в работу, Дата закрытия, Фото
  const DEFAULT_COL_WIDTHS = [150, 220, 260, 140, 170, 200, 140, 150, 150, 130];
  // Минимальная ширина каждого столбца: чтобы данные не превращались в кашу
  const MIN_COL_WIDTHS = [130, 170, 160, 100, 120, 120, 110, 130, 130, 110];

  let colWidths = (() => {
    try{
      const saved = JSON.parse(localStorage.getItem(COL_WIDTHS_KEY) || 'null');
      if(Array.isArray(saved) && saved.length === DEFAULT_COL_WIDTHS.length){
        return saved.map((w, i) => Math.max(MIN_COL_WIDTHS[i], Number(w) || DEFAULT_COL_WIDTHS[i]));
      }
    } catch(e){}
    return DEFAULT_COL_WIDTHS.slice();
  })();

  function saveColWidths(){
    try{ localStorage.setItem(COL_WIDTHS_KEY, JSON.stringify(colWidths)); } catch(e){}
  }

  document.getElementById('sheetLink').href = SHEET_URL;

  // ==== Текущий пользователь — из общей авторизации (login.html → auth-guard.js) ====
  // Если токена нет, auth-guard.js уже отправил на login.html.
  let currentUser = ((window.gcheckUser && window.gcheckUser.name) || '').trim();
  const currentUserEl = document.getElementById('currentUserName');
  currentUserEl.textContent = currentUser || '—';

  // auth-guard.js после фоновой сверки с сервером может обновить данные пользователя
  document.addEventListener('gcheck:user', () => {
    const n = ((window.gcheckUser && window.gcheckUser.name) || '').trim();
    if(n){
      currentUser = n;
      currentUserEl.textContent = n;
    }
  });

  // ==== Состояние списка заявок ====
  let header = [];
  let colIdx = {};
  let rows = [];
  let activeStatus = null; // null = "Все"
  let searchQuery = '';
  let sortCol = 0;          // по умолчанию сортируем по "Дата создания"
  let sortDir = -1;         // -1 = по убыванию — новые заявки сверху
  let dateMode = 'all';     // all | today | yesterday | range

  const contentEl = document.getElementById('content');
  const stateBox = document.getElementById('stateBox');
  const rowCountEl = document.getElementById('rowCount');
  const statusSelect = document.getElementById('statusSelect');
  const statusFilterWrap = document.getElementById('statusFilterWrap');
  const dateChips = document.getElementById('dateChips');
  const rangeWrap = document.getElementById('rangeWrap');
  const dateFromEl = document.getElementById('dateFrom');
  const dateToEl = document.getElementById('dateTo');
  const resetFiltersBtn = document.getElementById('resetFilters');
  const searchInput = document.getElementById('searchInput');

  // Порядок должен совпадать со столбцами в таблице
  const COLUMN_KEYS = ['Дата создания', 'Статус', 'Краткое описание заявки', 'Участок', 'Тип оборудования', 'Оборудование', 'Заявитель', 'Взято в работу', 'Дата закрытия', 'Фото'];
  const IDX = { createdAt: 0, status: 1, name: 2, area: 3, eqType: 4, equipment: 5, requester: 6, takenAt: 7, closedAt: 8, photo: 9 };

  function loadData(){
    const range = encodeURIComponent(SHEET_NAME);
    const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}`;

    fetch(apiUrl)
      .then(r => {
        if(!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(data => {
        const values = data.values || [];
        if(values.length === 0){
          stateBox.textContent = 'В таблице пока нет ни одной заявки.';
          return;
        }
        header = values[0];
        colIdx = {};
        header.forEach((h, i) => { colIdx[String(h).trim()] = i; });

        const missing = COLUMN_KEYS.filter(k => !(k in colIdx));
        if(missing.length > 0){
          stateBox.textContent = 'В таблице не найдены столбцы: ' + missing.join(', ') + '. Проверьте заголовки в первой строке таблицы.';
          stateBox.classList.add('error');
          return;
        }

        rows = values.slice(1).map((r, i) => ({
          rowIndex: i + 2,
          cells: COLUMN_KEYS.map(k => r[colIdx[k]] || '')
        })).filter(row => row.cells.some(c => c !== ''));

        renderStatusTabs();
        renderTable();
      })
      .catch(err => {
        stateBox.textContent = 'Не удалось загрузить данные таблицы. Проверьте SHEET_ID, API_KEY и доступ "по ссылке — Читатель". (' + err.message + ')';
        stateBox.classList.add('error');
      });
  }

  // ==== Фильтр по дате создания ====
  function ymd(d){
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function dayStartMs(v){
    if(!v) return null;
    const [y, m, d] = v.split('-').map(Number);
    return new Date(y, m - 1, d, 0, 0, 0, 0).getTime();
  }
  function dayEndMs(v){
    if(!v) return null;
    const [y, m, d] = v.split('-').map(Number);
    return new Date(y, m - 1, d, 23, 59, 59, 999).getTime();
  }

  // Границы выбранного периода: [от, до] (null = без ограничения) или null, если фильтра нет
  function dateBounds(){
    const now = new Date();
    if(dateMode === 'today'){
      const t = ymd(now);
      return [dayStartMs(t), dayEndMs(t)];
    }
    if(dateMode === 'yesterday'){
      const y = new Date(now); y.setDate(y.getDate() - 1);
      const t = ymd(y);
      return [dayStartMs(t), dayEndMs(t)];
    }
    if(dateMode === 'range'){
      const from = dayStartMs(dateFromEl.value);
      const to = dayEndMs(dateToEl.value);
      if(from === null && to === null) return null;
      return [from, to];
    }
    return null;
  }

  function inDateRange(r){
    const b = dateBounds();
    if(!b) return true;
    const ts = parseRuDate(r.cells[IDX.createdAt]);
    if(ts === null) return false;
    if(b[0] !== null && ts < b[0]) return false;
    if(b[1] !== null && ts > b[1]) return false;
    return true;
  }

  function hasActiveFilters(){
    return !!activeStatus || dateMode !== 'all' || !!searchQuery;
  }

  // Выпадающий список статусов со счётчиками (с учётом выбранного периода)
  function renderStatusTabs(){
    const inRange = rows.filter(inDateRange);
    const counts = {};
    STATUSES.forEach(s => counts[s] = 0);
    inRange.forEach(r => {
      const s = r.cells[IDX.status];
      if(counts[s] !== undefined) counts[s]++;
    });

    statusSelect.innerHTML =
      `<option value="">Все статусы (${inRange.length})</option>` +
      STATUSES.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)} (${counts[s]})</option>`).join('');
    statusSelect.value = activeStatus || '';
    statusFilterWrap.classList.toggle('has-value', !!activeStatus);
    resetFiltersBtn.classList.toggle('show', hasActiveFilters());
  }

  function statusPickerHtml(rowIndex, cur){
    const options = ALLOWED_TRANSITIONS[cur] || [];
    const cls = STATUS_CLASS[cur] || '';
    const isStatic = options.length === 0;
    const menu = options.map(s =>
      `<button type="button" class="status-option" data-value="${escapeHtml(s)}">${escapeHtml(s)}</button>`
    ).join('');
    return `
      <div class="status-picker" data-row-index="${rowIndex}" data-current="${escapeHtml(cur)}">
        <button type="button" class="status-btn ${cls}${isStatic ? ' static' : ''}"${isStatic ? ' tabindex="-1"' : ''}>
          <span class="status-label">${escapeHtml(cur)}</span><span class="chev">▾</span>
        </button>
        <div class="status-menu">${menu}</div>
      </div>`;
  }

  function renderTable(){
    let filtered = rows.filter(inDateRange);
    if(activeStatus){
      filtered = filtered.filter(r => r.cells[IDX.status] === activeStatus);
    }
    if(searchQuery){
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(r =>
        r.cells[IDX.name].toLowerCase().includes(q) ||
        r.cells[IDX.area].toLowerCase().includes(q) ||
        r.cells[IDX.eqType].toLowerCase().includes(q) ||
        r.cells[IDX.equipment].toLowerCase().includes(q) ||
        r.cells[IDX.requester].toLowerCase().includes(q)
      );
    }

    if(sortCol !== null){
      filtered = filtered.slice().sort((a, b) => {
        const av = a.cells[sortCol] || '';
        const bv = b.cells[sortCol] || '';
        const ad = parseRuDate(av), bd = parseRuDate(bv);
        let cmp;
        if(ad !== null && bd !== null){
          cmp = ad - bd;
        } else if(ad !== null && bd === null){
          cmp = -1;
        } else if(ad === null && bd !== null){
          cmp = 1;
        } else {
          cmp = av.localeCompare(bv, 'ru');
        }
        return cmp * sortDir;
      });
    }

    rowCountEl.textContent = `Заявок: ${filtered.length} из ${rows.length}`;
    resetFiltersBtn.classList.toggle('show', hasActiveFilters());

    if(filtered.length === 0){
      contentEl.innerHTML = '<div class="state-box">Ничего не найдено.</div>';
      return;
    }

    const HEADERS = ['Дата создания', 'Статус', 'Наименование заявки', 'Участок', 'Тип оборудования', 'Оборудование', 'Заявитель', 'Взято в работу', 'Дата закрытия', 'Фото'];

    const colgroupHtml = '<colgroup>' + colWidths.map(w => `<col style="width:${w}px">`).join('') + '</colgroup>';
    const totalWidth = colWidths.reduce((a, b) => a + b, 0);

    const theadHtml = '<thead><tr>' + HEADERS.map((h, i) => {
      const resizer = `<span class="col-resizer" data-col="${i}"></span>`;
      if(i === IDX.status){
        return `<th>${h}${resizer}</th>`;
      }
      const active = sortCol === i;
      const arrow = active ? (sortDir === 1 ? '▲' : '▼') : '↕';
      return `<th class="sortable${active ? ' sort-active' : ''}" data-col="${i}">${h}<span class="sort-arrow">${arrow}</span>${resizer}</th>`;
    }).join('') + '</tr></thead>';

    const tbodyHtml = '<tbody>' + filtered.map(r => `
      <tr data-row-index="${r.rowIndex}" class="${ROW_CLASS[r.cells[IDX.status]] || ''}">
        <td class="cell-muted">${escapeHtml(r.cells[IDX.createdAt])}</td>
        <td class="status-cell">${statusPickerHtml(r.rowIndex, r.cells[IDX.status])}</td>
        <td class="name-cell">${escapeHtml(r.cells[IDX.name])}</td>
        <td class="nowrap-cell">${escapeHtml(r.cells[IDX.area])}</td>
        <td class="equipment-cell">${escapeHtml(r.cells[IDX.eqType])}</td>
        <td class="equipment-cell">${escapeHtml(r.cells[IDX.equipment])}</td>
        <td class="cell-muted">${escapeHtml(r.cells[IDX.requester])}</td>
        <td class="cell-muted taken-at-cell">${escapeHtml(r.cells[IDX.takenAt])}</td>
        <td class="cell-muted closed-at-cell">${escapeHtml(r.cells[IDX.closedAt])}</td>
        <td class="cell-muted">${r.cells[IDX.photo] ? `<button type="button" class="photo-link" data-photo-url="${escapeHtml(r.cells[IDX.photo])}" data-photo-name="${escapeHtml(r.cells[IDX.name])}">🖼 Показать фото</button>` : ''}</td>
      </tr>
    `).join('') + '</tbody>';

    contentEl.innerHTML = `<div class="table-scroll"><table style="width:${totalWidth}px; min-width:100%">${colgroupHtml}${theadHtml}${tbodyHtml}</table></div>`;

    initStatusPickers();
    initResizers();

    contentEl.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', (e) => {
        if(e.target.classList.contains('col-resizer')) return;
        const col = parseInt(th.dataset.col, 10);
        if(sortCol === col){
          sortDir = -sortDir;
        } else {
          sortCol = col;
          sortDir = 1;
        }
        renderTable();
      });
    });
  }

  // ==== Обработчики фильтров ====
  statusSelect.addEventListener('change', () => {
    activeStatus = statusSelect.value || null;
    statusFilterWrap.classList.toggle('has-value', !!activeStatus);
    renderTable();
  });

  function setDateMode(mode){
    dateMode = mode;
    dateChips.querySelectorAll('.date-chip').forEach(b => b.classList.toggle('active', b.dataset.d === mode));
    rangeWrap.hidden = mode !== 'range';
    renderStatusTabs();
    renderTable();
  }

  dateChips.addEventListener('click', (e) => {
    const b = e.target.closest('.date-chip');
    if(!b) return;
    setDateMode(b.dataset.d);
    if(b.dataset.d === 'range' && !dateFromEl.value && !dateToEl.value){
      dateFromEl.focus();
    }
  });

  [dateFromEl, dateToEl].forEach(el => el.addEventListener('change', () => {
    // Если "с" позже "по" — меняем местами
    if(dateFromEl.value && dateToEl.value && dateFromEl.value > dateToEl.value){
      const t = dateFromEl.value;
      dateFromEl.value = dateToEl.value;
      dateToEl.value = t;
    }
    renderStatusTabs();
    renderTable();
  }));

  resetFiltersBtn.addEventListener('click', () => {
    activeStatus = null;
    searchQuery = '';
    searchInput.value = '';
    dateFromEl.value = '';
    dateToEl.value = '';
    setDateMode('all');
  });

  // ==== Изменение ширины столбцов ====
  function initResizers(){
    const table = contentEl.querySelector('table');
    if(!table) return;
    const cols = table.querySelectorAll('col');

    table.querySelectorAll('.col-resizer').forEach(handle => {
      handle.addEventListener('click', e => e.stopPropagation());

      handle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const i = parseInt(handle.dataset.col, 10);
        const startX = e.clientX;
        const startW = colWidths[i];

        handle.setPointerCapture(e.pointerId);
        handle.classList.add('active');
        document.body.classList.add('resizing');

        const onMove = (ev) => {
          const w = Math.max(MIN_COL_WIDTHS[i], startW + (ev.clientX - startX));
          colWidths[i] = w;
          cols[i].style.width = w + 'px';
          table.style.width = colWidths.reduce((a, b) => a + b, 0) + 'px';
          table.style.minWidth = '100%';
        };
        const onUp = () => {
          handle.classList.remove('active');
          document.body.classList.remove('resizing');
          handle.removeEventListener('pointermove', onMove);
          handle.removeEventListener('pointerup', onUp);
          handle.removeEventListener('pointercancel', onUp);
          saveColWidths();
        };

        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onUp);
        handle.addEventListener('pointercancel', onUp);
      });

      // Двойной клик по ручке — сброс ширины этого столбца
      handle.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        const i = parseInt(handle.dataset.col, 10);
        colWidths[i] = DEFAULT_COL_WIDTHS[i];
        saveColWidths();
        renderTable();
      });
    });
  }

  // ==== Выбор статуса ====
  function closeAllMenus(){
    document.querySelectorAll('.status-menu.show').forEach(m => m.classList.remove('show'));
  }

  function initStatusPickers(){
    contentEl.querySelectorAll('.status-picker').forEach(picker => {
      const btn = picker.querySelector('.status-btn');
      const menu = picker.querySelector('.status-menu');
      if(btn.classList.contains('static')) return;

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = menu.classList.contains('show');
        closeAllMenus();
        if(wasOpen) return;

        // Если снизу мало места — открываем вверх
        menu.classList.remove('up');
        menu.classList.add('show');
        const rect = menu.getBoundingClientRect();
        if(rect.bottom > window.innerHeight - 8){
          menu.classList.add('up');
        }
      });

      menu.querySelectorAll('.status-option').forEach(opt => {
        opt.addEventListener('click', (e) => {
          e.stopPropagation();
          closeAllMenus();
          changeStatus(picker, opt.dataset.value);
        });
      });
    });
  }

  document.addEventListener('click', closeAllMenus);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeAllMenus(); });

  function changeStatus(picker, newStatus){
    const rowIndex = parseInt(picker.dataset.rowIndex, 10);
    const btn = picker.querySelector('.status-btn');
    const tr = picker.closest('tr');
    const rowData = rows.find(r => r.rowIndex === rowIndex);
    if(!rowData) return;

    btn.disabled = true;
    btn.className = 'status-btn ' + (STATUS_CLASS[newStatus] || '');
    picker.querySelector('.status-label').textContent = newStatus;

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'setStatus', rowIndex, newStatus, by: currentUser })
    })
      .then(r => r.json())
      .then(res => {
        if(!res.ok){
          throw new Error(res.error || 'Неизвестная ошибка');
        }
        rowData.cells[IDX.status] = newStatus;
        rowData.cells[IDX.takenAt] = res.takenAt || '';
        rowData.cells[IDX.closedAt] = res.closedAt || '';
        renderStatusTabs();
        renderTable();
      })
      .catch(err => {
        // Откатываем отображение к прежнему статусу
        const prev = rowData.cells[IDX.status];
        btn.disabled = false;
        btn.className = 'status-btn ' + (STATUS_CLASS[prev] || '');
        picker.querySelector('.status-label').textContent = prev;

        let errBox = tr.querySelector('.save-error');
        if(!errBox){
          errBox = document.createElement('div');
          errBox.className = 'save-error';
          picker.parentElement.appendChild(errBox);
        }
        errBox.textContent = 'Не удалось сохранить: ' + err.message;
        setTimeout(() => { if(errBox) errBox.remove(); }, 5000);
      });
  }

  function parseRuDate(str){
    if(!str) return null;
    const m = String(str).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if(!m) return null;
    const [, d, mo, y, h, mi, s] = m;
    const dt = new Date(
      parseInt(y, 10),
      parseInt(mo, 10) - 1,
      parseInt(d, 10),
      h ? parseInt(h, 10) : 0,
      mi ? parseInt(mi, 10) : 0,
      s ? parseInt(s, 10) : 0
    );
    return isNaN(dt.getTime()) ? null : dt.getTime();
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim();
    renderTable();
  });

  if(currentUser){
    loadData();
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // ==== Модальное окно "Создать заявку" ====
  const createOverlay = document.getElementById('createOverlay');
  const openCreateModal = document.getElementById('openCreateModal');
  const createClose = document.getElementById('createClose');
  const createForm = document.getElementById('createForm');
  const createError = document.getElementById('createError');
  const createSuccess = document.getElementById('createSuccess');
  const createSubmit = document.getElementById('createSubmit');
  const fieldName = document.getElementById('fieldName');
  const fieldArea = document.getElementById('fieldArea');
  const fieldEqType = document.getElementById('fieldEqType');
  const fieldEquipment = document.getElementById('fieldEquipment');

  fieldArea.innerHTML = '<option value="" disabled selected>Выберите участок</option>' +
    AREAS.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');

  fieldEqType.innerHTML = '<option value="" disabled selected>Выберите тип оборудования</option>' +
    EQUIPMENT_TYPES.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');

  function resetCreateForm(){
    createForm.reset();
    fieldArea.selectedIndex = 0;
    fieldEqType.selectedIndex = 0;
    currentPhotoDataUrl = '';
    photoPreviewWrap.style.display = 'none';
  }

  openCreateModal.addEventListener('click', () => {
    createOverlay.classList.add('show');
    createError.classList.remove('show');
    createSuccess.classList.remove('show');
    resetCreateForm();
  });

  createClose.addEventListener('click', closeCreateModal);
  createOverlay.addEventListener('click', (e) => { if(e.target === createOverlay) closeCreateModal(); });

  function closeCreateModal(){
    createOverlay.classList.remove('show');
  }

  createForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    createError.classList.remove('show');

    if(!currentUser){
      createError.textContent = 'Не удалось определить пользователя. Выйдите из аккаунта и войдите заново.';
      createError.classList.add('show');
      return;
    }

    createSubmit.disabled = true;
    createSubmit.textContent = 'Отправляем...';

    const name = fieldName.value.trim();
    const photo = currentPhotoDataUrl;

    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'createRequest',
          name,
          area: fieldArea.value,
          equipmentType: fieldEqType.value,
          equipment: fieldEquipment.value.trim(),
          requester: currentUser,
          hasPhoto: !!photo
        })
      });
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || 'Неизвестная ошибка');

      closeCreateModal();
      resetCreateForm();
      createSubmit.disabled = false;
      createSubmit.textContent = 'Отправить заявку';

      if(photo){
        showToast('Заявка создана. Загружаем фото…');
        uploadPhotoInBackground(data.rowIndex, name, photo);
      } else {
        showToast('Заявка создана ✓');
      }
      loadData();
    } catch(err){
      createError.textContent = 'Не удалось создать заявку: ' + err.message;
      createError.classList.add('show');
      createSubmit.disabled = false;
      createSubmit.textContent = 'Отправить заявку';
    }
  });

  let pendingUploads = 0;

  async function uploadPhotoInBackground(rowIndex, name, photo){
    pendingUploads++;
    for(let attempt = 1; attempt <= 3; attempt++){
      try{
        const r = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'attachPhoto', rowIndex, name, requester: currentUser, photo })
        });
        const d = await r.json();
        if(!d.ok) throw new Error(d.error || 'Неизвестная ошибка');
        pendingUploads--;
        showToast('Фото загружено ✓');
        loadData();
        return;
      } catch(err){
        if(attempt === 3){
          pendingUploads--;
          showToast('Не удалось загрузить фото: ' + err.message, true);
        } else {
          await new Promise(res => setTimeout(res, 2000 * attempt));
        }
      }
    }
  }

  function showToast(text, isError){
    let t = document.getElementById('toast');
    if(!t){
      t = document.createElement('div');
      t.id = 'toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2000;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:90vw;';
      document.body.appendChild(t);
    }
    t.textContent = text;
    t.style.background = isError ? 'var(--danger)' : 'var(--accent)';
    t.style.color = '#fff';
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.display = 'none'; }, isError ? 6000 : 3000);
  }

  window.addEventListener('beforeunload', (e) => {
    if(pendingUploads > 0){ e.preventDefault(); e.returnValue = ''; }
  });

  // ==== Автообновление страницы при бездействии ====
  const IDLE_TIMEOUT_MS = 60 * 1000; // 1 минута
  let idleTimer = null;

  function isBusy(){
    // Не перезагружаем, пока открыта модалка создания заявки.
    if(createOverlay.classList.contains('show')) return true;
    // Не перезагружаем, пока идёт сохранение статуса.
    if(document.querySelector('.status-btn:disabled')) return true;
    // Не перезагружаем, пока открыто меню статуса.
    if(document.querySelector('.status-menu.show')) return true;
    // Не перезагружаем во время перетаскивания границы столбца.
    if(document.body.classList.contains('resizing')) return true;
    if(pendingUploads > 0) return true;
    return false;
  }

  function scheduleReload(){
    if(idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if(isBusy()){
        scheduleReload();
        return;
      }
      location.reload();
    }, IDLE_TIMEOUT_MS);
  }

  ['click', 'touchstart', 'input', 'keydown', 'pointerdown'].forEach(evt => {
    document.addEventListener(evt, scheduleReload, { passive: true });
  });

  document.addEventListener('visibilitychange', () => {
    if(!document.hidden){
      scheduleReload();
    }
  });

  scheduleReload();

  // ==== Сжатие фото ====
  const fieldPhoto = document.getElementById('fieldPhoto');
  const photoPreviewWrap = document.getElementById('photoPreviewWrap');
  const photoPreview = document.getElementById('photoPreview');
  const photoRemove = document.getElementById('photoRemove');

  let currentPhotoDataUrl = ''; // сжатое фото в base64, готовое к отправке

  const PHOTO_MAX_DIMENSION = 1000; // px по длинной стороне
  const PHOTO_QUALITY = 0.65;       // JPEG качество

  function compressImage(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = () => { img.src = reader.result; };
      reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > PHOTO_MAX_DIMENSION){
          height = Math.round(height * (PHOTO_MAX_DIMENSION / width));
          width = PHOTO_MAX_DIMENSION;
        } else if(height > PHOTO_MAX_DIMENSION){
          width = Math.round(width * (PHOTO_MAX_DIMENSION / height));
          height = PHOTO_MAX_DIMENSION;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY));
      };
      img.onerror = () => reject(new Error('Не удалось обработать изображение'));
      reader.readAsDataURL(file);
    });
  }

  fieldPhoto.addEventListener('change', async () => {
    const file = fieldPhoto.files[0];
    if(!file) return;

    try{
      currentPhotoDataUrl = await compressImage(file);
      photoPreview.src = currentPhotoDataUrl;
      photoPreviewWrap.style.display = '';
    } catch(err){
      createError.textContent = 'Не удалось обработать фото: ' + err.message;
      createError.classList.add('show');
      fieldPhoto.value = '';
      currentPhotoDataUrl = '';
    }
  });

  photoRemove.addEventListener('click', () => {
    currentPhotoDataUrl = '';
    fieldPhoto.value = '';
    photoPreviewWrap.style.display = 'none';
  });

  // ==== Модалка просмотра фото ====
  const photoOverlay = document.getElementById('photoOverlay');
  const photoModalImg = document.getElementById('photoModalImg');
  const photoTitle = document.getElementById('photoTitle');
  const photoClose = document.getElementById('photoClose');

  contentEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.photo-link');
    if(!btn) return;
    photoTitle.textContent = 'Фото — ' + btn.dataset.photoName;
    photoModalImg.src = btn.dataset.photoUrl;
    photoOverlay.classList.add('show');
  });

  photoClose.addEventListener('click', () => photoOverlay.classList.remove('show'));
  photoOverlay.addEventListener('click', (e) => { if(e.target === photoOverlay) photoOverlay.classList.remove('show'); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') photoOverlay.classList.remove('show'); });
</script>

</body>
</html>
