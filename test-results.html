<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Результаты тестирования — Hismar Check"><script src="auth-guard.js"></script><style>
:root{--green:#3a5a52;--bg:#f6f5f1;--line:#e4e2d9}*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--bg);font-family:Arial,sans-serif;color:#20201c}.wrap{max-width:1200px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:22px}.muted{color:#777;font-size:13px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:18px}table{border-collapse:collapse;min-width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;max-width:320px;white-space:normal}th{background:var(--green);color:#fff;position:sticky;top:0}tr:nth-child(even) td{background:#f7f9f8}.status{padding:18px;color:#666}a{display:inline-block;border-radius:8px;padding:11px 15px;background:var(--green);color:#fff;text-decoration:none;font-weight:600}
</style></head><body><div class="wrap"><div class="head"><div><h1>Результаты тестирования</h1><div class="muted" id="meta">Проверяем права доступа…</div></div><a href="index.html">На главную</a></div><div class="table-wrap"><div class="status" id="status">Загружаем результаты…</div><table id="results" hidden></table></div></div><script>
const API='https://script.google.com/macros/s/AKfycbw65iyi4m1X3Bu1KIrcJwiQCnqQ83odteQc2MtEYnkEjHCiVqQV6sIVwJoUYrCQFR2ALQ/exec';const auth=(()=>{try{return JSON.parse(localStorage.getItem('gcheck_auth')||'null')}catch(e){return null}})();const statusEl=document.getElementById('status');
async function load(){if(!auth||!auth.token){statusEl.textContent='Не найдена активная сессия. Войдите в Hismar Check.';return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'testGetResults',token:auth.token})});const d=await r.json();if(!d.ok)throw new Error(d.error||'Доступ запрещён');render(d)}catch(e){statusEl.textContent=e.message||'Не удалось загрузить результаты.'}}
function render(data){document.getElementById('meta').textContent='Всего попыток: '+(data.total||0)+' · Показаны последние '+(data.rows||[]).length;if(!data.rows||!data.rows.length){statusEl.textContent='Пока нет сохранённых результатов.';return}statusEl.hidden=true;const table=document.getElementById('results');table.hidden=false;const thead=document.createElement('thead'),hr=document.createElement('tr');data.headers.forEach(v=>{const th=document.createElement('th');th.textContent=v;hr.appendChild(th)});thead.appendChild(hr);table.appendChild(thead);const tbody=document.createElement('tbody');data.rows.forEach(row=>{const tr=document.createElement('tr');row.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tbody.appendChild(tr)});table.appendChild(tbody)}load();
</script></body></html>
