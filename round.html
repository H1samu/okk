<!DOCTYPE html>
<html lang="ru">
<head>
<script src="auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обход оборудования — Hismar Check</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a5a52">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1; --surface:#fff; --border:#e4e2d9; --border-strong:#c9c6b8;
    --text:#20201c; --text-secondary:#6b6a61; --text-muted:#98968a;
    --accent:#3a5a52; --accent-soft:#e8efec; --danger:#9c3b34; --danger-soft:#fbebe9;
    --ok:#2f7a3e; --ok-soft:#e8f5ea; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',Arial,sans-serif; -webkit-font-smoothing:antialiased;}
  button,input,select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .wrap{max-width:760px; margin:0 auto; padding:20px 16px 60px;}
  .wrap.filling{padding-bottom:120px;}
  .back-link{display:inline-flex; font-size:13px; color:var(--text-secondary); text-decoration:none; margin-bottom:16px; padding:6px 0; background:none; border:none; cursor:pointer;}
  h1{font-size:22px; font-weight:700; margin:0 0 4px;}
  h2{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:26px 0 10px;}
  .sub{font-size:13px; color:var(--text-secondary); margin:0 0 12px;}
  .ext-links{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .ext-links a{display:inline-flex; align-items:center; gap:7px; min-height:44px; font-size:13px; font-weight:600; text-decoration:none; color:var(--accent); background:var(--accent-soft); border:1px solid var(--border); border-radius:999px; padding:0 16px;}
  .ext-links a:hover{border-color:var(--border-strong);}
  .state-box{text-align:center; padding:50px 20px; color:var(--text-muted); font-size:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);}
  .state-box.error{color:var(--danger); background:var(--danger-soft); border-color:transparent;}
  [hidden]{display:none !important;}

  /* Стартовая карточка */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 16px;}
  .card.done{border-color:#c3e2cb; background:#f3faf4;}
  .card h3{margin:0 0 10px; font-size:16px;}
  .card .row{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--border); font-size:14px;}
  .card .row span:first-child{color:var(--text-secondary);}
  .card .row b.good{color:var(--ok);} .card .row b.bad{color:var(--danger);}
  .primary{width:100%; height:48px; margin-top:14px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer;}
  .primary:active{transform:scale(.98);}
  .card.top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 16px;}
  .card.top .info{flex:1 1 220px; min-width:0;}
  .card.top h3{margin:0 0 6px; font-size:15px;}
  .mini{font-size:13px; color:var(--text-secondary); line-height:1.5;}
  .mini b.good{color:var(--ok);} .mini b.bad{color:var(--danger);}
  .primary.side{width:auto; flex:1 1 160px; max-width:240px; margin:0; padding:0 18px;}

  /* Фильтры истории */
  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .filters select{flex:1 1 180px; height:44px; padding:0 12px; border:1px solid var(--border-strong); border-radius:10px; font-size:14px; background:var(--surface); color:var(--text);}
  .meta{font-size:12px; color:var(--text-muted); margin-bottom:10px;}
  .round summary .ttl{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .round summary .who{font-size:12px; font-weight:500; color:var(--text-secondary);}
  .pill{font-size:12px; font-weight:700; white-space:nowrap;}
  .pill .g{color:var(--ok);} .pill .b{color:var(--danger);}
  .inner{border-top:1px solid var(--border); padding:6px 16px 12px;}
  .grp{font-size:12px; font-weight:700; color:var(--text-secondary); margin:12px 0 4px;}
  .grp.bad{color:var(--danger);} .grp.good{color:var(--ok);}
  .sec{font-size:12px; font-weight:600; color:var(--text-muted); margin:8px 0 2px;}
  .li{font-size:13px; line-height:1.35; padding:6px 10px; border-radius:8px; margin-bottom:3px; overflow-wrap:anywhere;}
  .li.bad{background:var(--danger-soft);} .li.good{background:#f3faf4;}
  .none{font-size:13px; color:var(--text-muted); padding:8px 0;}
  .more{width:100%; height:44px; border:1px solid var(--border-strong); border-radius:10px; background:var(--surface); font-weight:600; cursor:pointer; color:var(--accent);}
  details.nested{border:none; border-radius:0; margin:8px 0 0; background:none;}
  details.nested>summary{padding:6px 0; min-height:0; font-size:13px; color:var(--ok);}

  /* Режим заполнения */
  .sticky{position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 0 10px;}
  .search{width:100%; height:44px; padding:0 16px; border:1px solid var(--border-strong); border-radius:999px; font-size:16px; background:var(--surface);}
  .bar{height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin-top:10px;}
  .bar>div{height:100%; width:0; background:var(--accent); transition:width .2s;}
  .stat{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); margin-top:6px;}
  .stat .good{color:var(--ok); font-weight:600;}
  .stat .bad{color:var(--danger); font-weight:600;}

  details{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
  summary{list-style:none; cursor:pointer; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-weight:600; font-size:14px; min-height:48px;}
  summary::-webkit-details-marker{display:none;}
  summary .cnt{font-size:12px; font-weight:600; color:var(--text-muted); white-space:nowrap;}
  summary .cnt.done{color:var(--ok);}
  .item{display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid var(--border);}
  .item .nm{flex:1; min-width:0; font-size:13px; line-height:1.35; overflow-wrap:anywhere;}
  .item.s-ok{background:#f3faf4;}
  .item.s-bad{background:var(--danger-soft);}
  .tg{display:flex; gap:6px; flex-shrink:0;}
  .tg button{width:48px; height:44px; border-radius:10px; border:1px solid var(--border-strong); background:var(--surface); font-size:18px; cursor:pointer; color:var(--text-muted);}
  .tg button:active{transform:scale(.95);}
  .tg .y.on{background:var(--ok); border-color:var(--ok); color:#fff;}
  .tg .n.on{background:var(--danger); border-color:var(--danger); color:#fff;}
  .allok{margin:0 16px 12px; height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--border-strong); background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:13px; cursor:pointer;}

  .foot{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--border); padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
  .foot .in{max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:center;}
  .foot .hint{flex:1; font-size:12px; color:var(--text-secondary);}
  .send{height:46px; padding:0 22px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer;}
  .send:disabled{opacity:.5; cursor:default;}
  .toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%); padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600; color:#fff; background:var(--accent); display:none; z-index:20; max-width:90vw;}
  .toast.err{background:var(--danger);}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <a class="back-link" id="backIndex" href="index.html">← Все журналы</a>
  <button class="back-link" id="backHome" type="button" hidden>← К обходу</button>
  <h1>Обход оборудования</h1>
  <p class="sub" id="sub"></p>

  <div class="ext-links">
    <a href="https://docs.google.com/spreadsheets/d/1C_UmSyIp7lyqewuISKvYIuknes0TPXINtyvibLgAwh0/edit?gid=1954643572#gid=1954643572" target="_blank" rel="noopener">📊 Открыть таблицу</a>
  </div>

  <!-- Главный экран -->
  <div id="home">
    <div class="state-box" id="homeLoad">Загрузка…</div>
    <div id="todayBox"></div>
    <div id="history" hidden>
      <h2>Статистика обходов</h2>
      <div class="filters">
        <select id="fDay" aria-label="День"></select>
        <select id="fEmp" aria-label="Сотрудник"></select>
      </div>
      <div class="meta" id="hMeta"></div>
      <div id="hList"></div>
    </div>
  </div>

  <!-- Чек-лист -->
  <div id="fill" hidden>
    <div class="sticky">
      <input class="search" id="q" type="search" placeholder="Поиск оборудования" autocomplete="off">
      <div class="bar"><div id="barFill"></div></div>
      <div class="stat"><span id="statL"></span><span id="statR"></span></div>
    </div>
    <div id="list"></div>
  </div>
</div>

<div class="foot" id="foot" hidden><div class="in">
  <div class="hint" id="hint"></div>
  <button class="send" id="send" type="button" disabled>Сохранить обход</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
  const API_KEY = 'AIzaSyCrXcA6Rzohxe0bWBD3W8veWLprb47m2lY';
  const SHEET_ID = '1C_UmSyIp7lyqewuISKvYIuknes0TPXINtyvibLgAwh0';
  const SHEET_GID = 1954643572;
  const ROUND_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZIvCHbIKEoj-AhrEa7hNJn5bChBNt8bxPoyoNcX5dEpT1ACRodRkMvfIzYfzMLVAr/exec';

  const $ = id => document.getElementById(id);
  const listEl = $('list'), sendBtn = $('send');
  const today = new Date().toLocaleDateString('ru-RU', {timeZone:'Europe/Moscow', day:'2-digit', month:'2-digit', year:'numeric'});
  const DRAFT_KEY = 'gcheck_round2_' + today;
  const PAGE = 20;

  let sections = [];   // {title, items:[{row,name}]}
  let days = [];       // {date,key,col,inspector,good,bad,res}
  let state = {};
  let updating = false;
  let shown = PAGE;
  let todayRound = null;
  let localToday = null;   // обход, только что сохранённый с этого устройства (пока таблица не отдала его через API)
  try{ state = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); }catch(e){}

  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const saveDraft = () => { try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); }catch(e){} };
  const pad = n => String(n).padStart(2, '0');

  function toast(t, err){
    const el = $('toast');
    el.textContent = t; el.classList.toggle('err', !!err); el.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = 'none', err ? 6000 : 3000);
  }

  // ===== Разбор таблицы =====
  const RX_SUM = /^(Осмотр провел|Исправное оборудование|Неисправное оборудование)/i;

  function parse(values){
    const out = []; let cur = null;
    values.forEach((r, i) => {
      if(i === 0) return;
      const n = String(r[0] || '').trim(), name = String(r[1] || '').trim();
      if(!name || RX_SUM.test(name)) return;
      if(/^\d+$/.test(n)){
        if(!cur){ cur = {title:'Без участка', items:[]}; out.push(cur); }
        cur.items.push({row: i + 1, name});
      } else if(!n){
        cur = {title:name, items:[]}; out.push(cur);
      }
    });
    return out.filter(s => s.items.length);
  }

  const markOf = v => {
    v = String(v || '').trim().toLowerCase();
    if(['+','✓','✔','да','ok','исправно'].includes(v)) return 'ok';
    if(['-','–','−','—','✗','✘','✕','нет','неисправно'].includes(v)) return 'bad';
    return '';
  };

  // Все столбцы-даты: кто провёл, сколько исправно/неисправно, отметки по позициям
  function parseDays(values){
    const rowOf = {};
    values.forEach((r, i) => {
      const m = String(r[1] || '').trim().match(RX_SUM);
      if(m) rowOf[m[1].toLowerCase()] = i;
    });
    const head = values[0] || [];
    const out = [];
    for(let c = 2; c < head.length; c++){
      const m = String(head[c] || '').trim().match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
      if(!m) continue;
      const res = {}; let g = 0, b = 0;
      sections.forEach(s => s.items.forEach(it => {
        const v = markOf((values[it.row - 1] || [])[c]);
        if(v){ res[it.row] = v; v === 'ok' ? g++ : b++; }
      }));
      if(g + b === 0) continue;
      const cell = k => rowOf[k] === undefined ? '' : String((values[rowOf[k]] || [])[c] || '').trim();
      const num = (k, fb) => { const n = parseInt(cell(k), 10); return isNaN(n) ? fb : n; };
      out.push({
        date: pad(+m[1]) + '.' + pad(+m[2]) + '.' + m[3],
        key: +m[3] * 10000 + +m[2] * 100 + +m[1],
        col: c,
        inspector: cell('осмотр провел'),
        good: num('исправное оборудование', g),
        bad: num('неисправное оборудование', b),
        res
      });
    }
    return out.sort((a, b) => b.key - a.key || b.col - a.col);
  }

  // ===== Загрузка =====
  async function load(final){
    try{
      const meta = await (await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?fields=sheets.properties&key=${API_KEY}`, {cache:'no-store'})).json();
      const p = (meta.sheets || []).map(s => s.properties).find(p => p.sheetId === SHEET_GID);
      if(!p) throw new Error('вкладка не найдена');
      const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(p.title)}?key=${API_KEY}`, {cache:'no-store'});
      if(!r.ok) throw new Error('http ' + r.status);
      const values = (await r.json()).values || [];
      sections = parse(values);
      if(!sections.length) throw new Error('список пуст');
      days = parseDays(values);
      if(localToday){
        const f = days.find(d => d.date === today);
        if(f && JSON.stringify(f.res) === JSON.stringify(localToday.res)) localToday = null;   // таблица догнала
        else if(final) localToday = null;                                                       // сдаёмся, верим таблице
        else days = [localToday, ...days.filter(d => d.date !== today)].sort((a, b) => b.key - a.key || b.col - a.col);
      }
      todayRound = days.find(d => d.date === today) || null;
      window.__dbg = {head: (values[0] || []).slice(0, 8), rows: values.length, days: days.length};
      console.log('round debug', window.__dbg);
      $('homeLoad').hidden = true;
      renderHome();
    }catch(e){
      if(localToday){ console.warn('reload failed', e); return; }
      $('homeLoad').hidden = false;
      $('homeLoad').className = 'state-box error';
      $('homeLoad').textContent = 'Не удалось загрузить список: ' + e.message + '. Проверьте доступ к таблице «по ссылке — Читатель».';
    }
  }

  // ===== Главный экран =====
  function renderHome(){
    $('sub').textContent = 'Сегодня: ' + today;
    const box = $('todayBox');
    if(todayRound){
      box.innerHTML = `<div class="card done top">
        <div class="info"><h3>✅ Сегодня обход выполнен</h3>
          <div class="mini">Осмотр провёл: <b>${esc(todayRound.inspector || '—')}</b></div>
          <div class="mini"><b class="good">Исправно: ${todayRound.good}</b> · <b class="bad">Неисправно: ${todayRound.bad}</b></div></div>
        <button class="primary side" type="button" id="btnUpdate">Обновить обход</button></div>`;
      $('btnUpdate').onclick = () => { state = Object.assign({}, todayRound.res); updating = true; saveDraft(); openFill(); };
    } else {
      box.innerHTML = `<div class="card top">
        <div class="info"><h3>Обход за сегодня не проведён</h3>
          <div class="mini">Откройте чек-лист и отметьте оборудование.</div></div>
        <button class="primary side" type="button" id="btnFill">✏️ Заполнить чек-лист</button></div>`;
      $('btnFill').onclick = () => {
        updating = false;
        try{ state = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); }catch(e){ state = {}; }
        openFill();
      };
    }
    buildFilters();
    renderHistory();
    const d = window.__dbg;
    if(d && !todayRound) $('todayBox').insertAdjacentHTML('beforeend',
      `<div class="meta" style="margin-top:8px">Диагностика: строк ${d.rows}, найдено дней ${d.days}. Заголовки: ${esc(JSON.stringify(d.head))}</div>`);
  }

  // ===== История с фильтрами =====
  function buildFilters(){
    const dSel = $('fDay'), eSel = $('fEmp');
    const curD = dSel.value, curE = eSel.value;
    const dates = [...new Set(days.map(d => d.date))];
    dSel.innerHTML = '<option value="">Все дни</option>' +
      dates.map(d => `<option value="${d}">${d}${d === today ? ' (сегодня)' : ''}</option>`).join('');
    const emps = [...new Set(days.map(d => d.inspector).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));
    eSel.innerHTML = '<option value="">Все сотрудники</option>' +
      emps.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');
    dSel.value = dates.includes(curD) ? curD : '';
    eSel.value = emps.includes(curE) ? curE : '';
    $('history').hidden = !days.length;
  }

  function groupBy(round, kind){
    const out = [];
    sections.forEach(s => {
      const items = s.items.filter(it => round.res[it.row] === kind);
      if(items.length) out.push({title: s.title, items});
    });
    return out;
  }
  const groupHtml = (groups, cls) => groups.map(g =>
    `<div class="sec">${esc(g.title)}</div>` + g.items.map(it => `<div class="li ${cls}">${esc(it.name)}</div>`).join('')
  ).join('');

  function roundHtml(r, open){
    const bad = groupBy(r, 'bad'), good = groupBy(r, 'ok');
    return `<details class="round"${open ? ' open' : ''}>
      <summary><span class="ttl"><span>${r.date}</span><span class="who">${esc(r.inspector || 'Сотрудник не указан')}</span></span>
        <span class="pill"><span class="g">✓ ${r.good}</span> · <span class="b">✗ ${r.bad}</span></span></summary>
      <div class="inner">
        <div class="grp bad">Неисправное оборудование (${r.bad})</div>
        ${bad.length ? groupHtml(bad, 'bad') : '<div class="none">Неисправного оборудования нет</div>'}
        <details class="nested"><summary>Исправное оборудование (${r.good})</summary>${groupHtml(good, 'good')}</details>
      </div></details>`;
  }

  function renderHistory(){
    const d = $('fDay').value, e = $('fEmp').value;
    const rows = days.filter(r => (!d || r.date === d) && (!e || r.inspector === e));
    $('hMeta').textContent = `Обходов: ${rows.length}`;
    if(!rows.length){ $('hList').innerHTML = '<div class="state-box">Ничего не найдено.</div>'; return; }
    const part = rows.slice(0, shown);
    $('hList').innerHTML = part.map((r, i) => roundHtml(r, !!d || i === 0)).join('') +
      (rows.length > shown ? `<button class="more" type="button" id="btnMore">Показать ещё (${rows.length - shown})</button>` : '');
    const more = $('btnMore');
    if(more) more.onclick = () => { shown += PAGE; renderHistory(); };
  }
  $('fDay').addEventListener('change', () => { shown = PAGE; renderHistory(); });
  $('fEmp').addEventListener('change', () => { shown = PAGE; renderHistory(); });

  // ===== Переключение экранов =====
  function openFill(){
    $('home').hidden = true; $('fill').hidden = false; $('foot').hidden = false;
    $('backIndex').hidden = true; $('backHome').hidden = false;
    $('wrap').classList.add('filling');
    $('sub').textContent = 'Обход за ' + today + '. Отмечайте каждую позицию: ✓ исправно (+), ✗ неисправно (−).';
    sendBtn.textContent = updating ? 'Обновить обход' : 'Сохранить обход';
    draw();
    window.scrollTo(0, 0);
  }
  function openHome(){
    $('home').hidden = false; $('fill').hidden = true; $('foot').hidden = true;
    $('backIndex').hidden = false; $('backHome').hidden = true;
    $('wrap').classList.remove('filling');
    $('sub').textContent = 'Сегодня: ' + today;
    window.scrollTo(0, 0);
  }
  $('backHome').addEventListener('click', openHome);

  // ===== Чек-лист =====
  function draw(){
    const q = $('q').value.trim().toLowerCase();
    const open = new Set([...listEl.querySelectorAll('details[open]')].map(d => d.dataset.si));
    listEl.innerHTML = sections.map((s, si) => {
      const done = s.items.filter(it => state[it.row]).length;
      const rows = s.items.map(it => {
        if(q && !it.name.toLowerCase().includes(q) && !s.title.toLowerCase().includes(q)) return '';
        const v = state[it.row];
        return `<div class="item ${v ? 's-' + v : ''}">
          <div class="nm">${esc(it.name)}</div>
          <div class="tg">
            <button class="n${v === 'bad' ? ' on' : ''}" data-r="${it.row}" data-v="bad" aria-label="Неисправно">✗</button>
            <button class="y${v === 'ok' ? ' on' : ''}" data-r="${it.row}" data-v="ok" aria-label="Исправно">✓</button>
          </div></div>`;
      }).join('');
      if(!rows) return '';
      const isOpen = q || open.has(String(si)) ? ' open' : '';
      const allOkBtn = s.items.length > 2
        ? `<button class="allok" type="button" data-all="${si}">${done === s.items.length ? '✕ Снять все отметки' : '✓ Всё исправно на этом участке'}</button>`
        : '';
      return `<details data-si="${si}"${isOpen}>
        <summary><span>${esc(s.title)}</span><span class="cnt${done === s.items.length ? ' done' : ''}">${done}/${s.items.length}</span></summary>
        ${allOkBtn}${rows}</details>`;
    }).join('') || '<div class="state-box">Ничего не найдено.</div>';
    updateStats();
  }

  function updateStats(){
    let total = 0, good = 0, bad = 0;
    sections.forEach(s => s.items.forEach(it => {
      total++; const st = state[it.row];
      if(st === 'ok') good++; else if(st === 'bad') bad++;
    }));
    const done = good + bad;
    $('barFill').style.width = (total ? done / total * 100 : 0) + '%';
    $('statL').textContent = `Отмечено ${done} из ${total}`;
    $('statR').innerHTML = `<span class="good">Исправно (+): ${good}</span> · <span class="bad">Неисправно (−): ${bad}</span>`;
    $('hint').textContent = done < total ? `Осталось: ${total - done}` : 'Всё отмечено';
    sendBtn.disabled = done < total || !total;
  }

  listEl.addEventListener('click', e => {
    const all = e.target.closest('[data-all]');
    if(all){
      const items = sections[+all.dataset.all].items;
      if(items.some(it => !state[it.row])){
        items.forEach(it => { if(!state[it.row]) state[it.row] = 'ok'; });
      } else {
        items.forEach(it => { if(state[it.row] === 'ok') delete state[it.row]; });
      }
      saveDraft(); draw(); return;
    }
    const b = e.target.closest('[data-r]'); if(!b) return;
    const r = b.dataset.r, v = b.dataset.v;
    if(state[r] === v) delete state[r]; else state[r] = v;
    saveDraft(); draw();
  });
  $('q').addEventListener('input', draw);

  // ===== Сохранение =====
  sendBtn.addEventListener('click', async () => {
    if(!/^https:\/\//.test(ROUND_SCRIPT_URL)){ toast('Не указан ROUND_SCRIPT_URL', true); return; }
    const results = [];
    sections.forEach(s => s.items.forEach(it => {
      results.push({row: it.row, name: it.name, ok: state[it.row] === 'ok'});
    }));
    sendBtn.disabled = true; sendBtn.textContent = 'Сохраняем…';
    try{
      const r = await fetch(ROUND_SCRIPT_URL, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'saveRound', token: window.gcheckUser.token, date: today, results})
      });
      const d = await r.json();
      if(!d.ok) throw new Error(d.error || 'ошибка сервера');
      toast(d.updated ? 'Обход обновлён ✓' : 'Обход сохранён ✓');
      try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
      // Сразу показываем «обход выполнен» по своим данным: API таблиц может отдавать старые значения несколько секунд
      const res = Object.assign({}, state);
      const vals = Object.values(res);
      const t = new Date(), parts = today.split('.');
      localToday = {
        date: today, key: +parts[2] * 10000 + +parts[1] * 100 + +parts[0], col: -1,
        inspector: ((window.gcheckUser && window.gcheckUser.name) || '').trim(),
        good: vals.filter(v => v === 'ok').length, bad: vals.filter(v => v === 'bad').length, res
      };
      days = [localToday, ...days.filter(d => d.date !== today)];
      todayRound = localToday;
      state = {};
      $('homeLoad').hidden = true;
      renderHome();
      openHome();
      setTimeout(() => { if(localToday) load(false); }, 3000);
      setTimeout(() => { if(localToday) load(true); }, 10000);
    }catch(err){
      toast('Не удалось сохранить: ' + err.message + '. Отметки сохранены на устройстве.', true);
      sendBtn.disabled = false;
      sendBtn.textContent = updating ? 'Обновить обход' : 'Сохранить обход';
    }
  });

  load();
  if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
