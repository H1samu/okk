<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Вход — Hismar Check</title>
<meta name="theme-color" content="#3a5a52">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;
    --surface:#ffffff;
    --border:#e4e2d9;
    --border-strong:#c9c6b8;
    --text:#20201c;
    --text-secondary:#6b6a61;
    --text-muted:#98968a;
    --accent:#3a5a52;
    --accent-soft:#e8efec;
    --danger:#9c3b34;
    --danger-soft:#fbebe9;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
    overflow:hidden;
  }
  body{
    margin:0;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:20px;
    overscroll-behavior:none;
  }
  .card{
    width:100%;
    max-width:360px;
    max-height:100%;
    overflow:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:32px 28px;
    text-align:center;
  }
  h1{
    font-size:20px;
    font-weight:700;
    margin:0 0 6px;
  }
  p.sub{
    font-size:13px;
    color:var(--text-secondary);
    margin:0 0 22px;
  }
  form{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  input{
    width:100%;
    padding:13px 16px;
    border:1px solid var(--border-strong);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    background:var(--bg);
    color:var(--text);
    transition:border-color .2s ease, background .2s ease;
  }
  input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  input:disabled{opacity:0.6;}
  #nameInput{text-align:center;}
  #pinInput{
    text-align:center;
    letter-spacing:6px;
    font-size:18px;
  }
  #pinInput::placeholder{letter-spacing:normal; font-size:15px;}
  input.valid{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
    outline:none;
  }

  /* подсказки ФИО (встроены в поток, чтобы не обрезались карточкой) */
  .suggest{
    list-style:none;
    margin:6px 0 0;
    padding:0;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    text-align:center;
  }
  .suggest[hidden]{display:none;}
  .suggest button{
    display:block;
    width:100%;
    padding:11px 14px;
    border:none;
    background:var(--surface);
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    text-align:center;
    cursor:pointer;
    border-radius:0;
  }
  .suggest li + li button{border-top:1px solid var(--border);}
  .suggest button:hover,
  .suggest button:focus-visible{background:var(--accent-soft);}

  .success, .error{
    font-size:13px;
    border-radius:8px;
    padding:9px 12px;
    display:none;
  }
  .success{
    color:var(--accent);
    background:var(--accent-soft);
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .success.show{display:flex;}
  .success svg{width:15px; height:15px; flex-shrink:0; stroke:var(--accent);}
  .success .checkmark{
    stroke-dasharray:20;
    stroke-dashoffset:20;
    animation:draw .3s ease forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .error{
    color:var(--danger);
    background:var(--danger-soft);
  }
  .error.show{display:block;}

  button.submit{
    padding:13px 16px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:opacity .15s ease, transform .15s ease;
  }
  button.submit:hover:not(:disabled){opacity:0.92;}
  button.submit:active:not(:disabled){transform:scale(0.99);}
  button.submit:disabled{opacity:0.6; cursor:default;}

  .site-footer{
    margin-top:22px;
    font-size:12px;
    color:var(--text-muted);
    opacity:0.6;
  }
  .site-footer a{color:inherit;}
</style>
</head>
<body>

<div class="card">
  <h1>Hismar Check</h1>
  <p class="sub">Введите ФИО и пинкод</p>

  <form id="loginForm" autocomplete="off" novalidate>
    <div>
      <input type="text" id="nameInput" placeholder="ФИО" autocomplete="off"
             autocapitalize="words" autocorrect="off" spellcheck="false" autofocus
             aria-label="ФИО" aria-autocomplete="list" aria-controls="suggest">
      <ul class="suggest" id="suggest" hidden></ul>
    </div>

    <input type="password" id="pinInput" placeholder="Пинкод" aria-label="Пинкод"
           inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">

    <div class="error" id="errorMsg" role="alert"></div>
    <div class="success" id="successMsg">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline class="checkmark" points="20 6 9 17 4 12"/></svg>
      <span>Добро пожаловать, <b id="successName"></b></span>
    </div>
    <button type="submit" class="submit" id="loginBtn">Войти</button>
  </form>

  <div class="site-footer">by <a href="https://t.me/hisamost" onclick="return openExternal(this.href)" rel="noopener">hisamost</a> &amp; <a href="https://t.me/katekateem" onclick="return openExternal(this.href)" rel="noopener">katekateem</a></div>
</div>

<script>
  function openExternal(url){
    const win = window.open(url, '_blank');
    if(!win){ window.location.href = url; }
    return false;
  }

  // URL веб-приложения Apps Script (таблица «Пользователи»)
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw65iyi4m1X3Bu1KIrcJwiQCnqQ83odteQc2MtEYnkEjHCiVqQV6sIVwJoUYrCQFR2ALQ/exec';
  const AUTH_KEY = 'gcheck_auth'; // { token, name, type, exp, checkedAt }

  const form = document.getElementById('loginForm');
  const nameInput = document.getElementById('nameInput');
  const pinInput = document.getElementById('pinInput');
  const suggestEl = document.getElementById('suggest');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const successName = document.getElementById('successName');
  const loginBtn = document.getElementById('loginBtn');

  function api(payload){
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(r => r.json());
  }

  // Куда вернуть после входа: только страницы этого же сайта
  function safeRedirect(){
    const r = new URLSearchParams(location.search).get('redirect');
    return (r && /^[^:\/\\?#]+\.html(\?[^#]*)?$/.test(r)) ? r : 'index.html';
  }

  // Уже вошли и токен не истёк — сразу дальше
  try{
    const saved = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
    if(saved && saved.token && saved.exp && Date.now() < saved.exp){
      location.replace(safeRedirect());
    }
  } catch(e){}

  // Прогрев: сразу при открытии страницы просим сервер "проснуться" и загрузить
  // список ФИО в кэш, чтобы первая подсказка не ждала холодного старта.
  api({ action: 'warmup' }).catch(() => {});

  // ===== Подсказки ФИО =====
  const SUGGEST_MIN = 3;
  const SUGGEST_SHOW = 5;
  const suggestCache = {};   // первые 3 символа -> список ФИО
  let suggestTimer = null;

  function norm(s){
    return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
  }

  function hideSuggest(){
    suggestEl.hidden = true;
    suggestEl.innerHTML = '';
  }

  function showSuggest(list){
    if(!list.length){ hideSuggest(); return; }
    suggestEl.innerHTML = '';
    list.slice(0, SUGGEST_SHOW).forEach(name => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      b.addEventListener('click', () => {
        nameInput.value = name;
        hideSuggest();
        clearError();
        pinInput.focus();
      });
      li.appendChild(b);
      suggestEl.appendChild(li);
    });
    suggestEl.hidden = false;
  }

  function filterLocal(names, q){
    const n = norm(q);
    return names.filter(x => (' ' + norm(x)).indexOf(' ' + n) !== -1);
  }

  nameInput.addEventListener('input', () => {
    clearError();
    clearTimeout(suggestTimer);
    const q = norm(nameInput.value);
    if(q.length < SUGGEST_MIN){ hideSuggest(); return; }

    const prefix = q.slice(0, SUGGEST_MIN);
    if(suggestCache[prefix]){
      showSuggest(filterLocal(suggestCache[prefix], nameInput.value));
      return;
    }
    // Запрос к серверу только по первым 3 символам, дальше фильтруем в браузере
    suggestTimer = setTimeout(() => {
      api({ action: 'suggest', query: prefix })
        .then(d => {
          if(!d.ok) return;
          suggestCache[prefix] = d.names || [];
          const cur = norm(nameInput.value);
          if(cur.slice(0, SUGGEST_MIN) === prefix){
            showSuggest(filterLocal(suggestCache[prefix], nameInput.value));
          }
        })
        .catch(() => {});
    }, 250);
  });

  document.addEventListener('click', (e) => {
    if(!suggestEl.contains(e.target) && e.target !== nameInput) hideSuggest();
  });

  // ===== Пинкод: только цифры =====
  pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
    clearError();

    // Вход сразу после четвёртой цифры (кнопка "Войти" остаётся запасным вариантом)
    if(pinInput.value.length === 4){
      if(form.requestSubmit){
        form.requestSubmit();
      } else {
        form.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    }
  });

  // ===== Ошибки и блокировка =====
  let lockTimer = null;
  let lockedUntil = 0;
  let busy = false;
  let done = false;

  function showError(text){
    errorMsg.textContent = text;
    errorMsg.classList.add('show');
  }
  function clearError(){
    if(lockedUntil > Date.now()) return; // сообщение о блокировке не стираем
    errorMsg.classList.remove('show');
  }

  function setBusy(v){
    busy = v;
    loginBtn.disabled = v || lockedUntil > Date.now();
    loginBtn.textContent = v ? 'Проверяем...' : 'Войти';
  }

  function startLock(sec){
    lockedUntil = Date.now() + sec * 1000;
    clearInterval(lockTimer);
    const tick = () => {
      const left = Math.ceil((lockedUntil - Date.now()) / 1000);
      if(left <= 0){
        clearInterval(lockTimer);
        lockedUntil = 0;
        errorMsg.classList.remove('show');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Войти';
        return;
      }
      const m = Math.floor(left / 60);
      const s = String(left % 60).padStart(2, '0');
      showError(`Слишком много неверных попыток. Повторите через ${m}:${s}`);
      loginBtn.disabled = true;
    };
    tick();
    lockTimer = setInterval(tick, 1000);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(busy || done || lockedUntil > Date.now()) return;

    const name = nameInput.value.trim();
    const pin = pinInput.value;

    if(!name){ showError('Введите ФИО'); nameInput.focus(); return; }
    if(!/^\d{4}$/.test(pin)){ showError('Пинкод состоит из 4 цифр'); pinInput.focus(); return; }

    hideSuggest();
    errorMsg.classList.remove('show');
    setBusy(true);

    try{
      const d = await api({ action: 'login', name, pin });

      if(d.ok){
        done = true;
        localStorage.setItem(AUTH_KEY, JSON.stringify({
          token: d.token, name: d.name, type: d.type, position: d.position, allowed: d.allowed,
exp: d.expiresAt, checkedAt: Date.now()
        }));
        localStorage.removeItem('gcheck_auth_time'); // старая сессия по общему паролю

        nameInput.classList.add('valid');
        pinInput.classList.add('valid');
        nameInput.readOnly = true;
        pinInput.readOnly = true;
        successName.textContent = d.name;
        successMsg.classList.add('show');
        loginBtn.textContent = 'Входим...';
        setTimeout(() => location.replace(safeRedirect()), 600);
        return;
      }

      if(d.error === 'locked'){
        setBusy(false);
        startLock(d.retryAfterSec || 300);
      } else if(d.error === 'invalid'){
        let msg = 'Неверное ФИО или пинкод';
        if(typeof d.attemptsLeft === 'number'){
          msg += `. Осталось попыток: ${d.attemptsLeft}`;
        }
        showError(msg);
        pinInput.value = '';
        pinInput.focus();
        setBusy(false);
      } else {
        showError('Ошибка сервера. Попробуйте ещё раз');
        setBusy(false);
      }
    } catch(err){
      showError('Нет связи с сервером. Проверьте интернет и повторите');
      setBusy(false);
    }
  });
</script>

</body>
</html>
