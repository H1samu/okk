<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — G-check</title>
<meta name="theme-color" content="#3a5a52">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;
    --surface:#ffffff;
    --border:#e4e2d9;
    --border-strong:#c9c6b8;
    --text:#20201c;
    --text-secondary:#6b6a61;
    --text-muted:#98968a;
    --accent:#3a5a52;
    --accent-soft:#e8efec;
    --danger:#9c3b34;
    --danger-soft:#fbebe9;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:20px;
  }
  .card{
    width:100%;
    max-width:360px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:32px 28px;
    text-align:center;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    font-weight:600;
    margin-bottom:8px;
  }
  h1{
    font-size:20px;
    font-weight:700;
    margin:0 0 6px;
  }
  p.sub{
    font-size:13px;
    color:var(--text-secondary);
    margin:0 0 22px;
  }
  form{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  input[type="password"]{
    width:100%;
    padding:13px 16px;
    border:1px solid var(--border-strong);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    background:var(--bg);
    color:var(--text);
    text-align:center;
    letter-spacing:2px;
    transition:border-color .2s ease, background .2s ease;
  }
  input[type="password"]:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  input[type="password"].valid{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
    outline:none;
  }
  .success{
    font-size:13px;
    color:var(--accent);
    background:var(--accent-soft);
    border-radius:8px;
    padding:9px 12px;
    display:none;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .success.show{display:flex;}
  .success svg{
    width:15px;
    height:15px;
    flex-shrink:0;
    stroke:var(--accent);
  }
  .success .checkmark{
    stroke-dasharray:20;
    stroke-dashoffset:20;
    animation:draw .3s ease forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  button{
    padding:13px 16px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:opacity .15s ease, transform .15s ease;
  }
  button:hover{opacity:0.92;}
  button:active{transform:scale(0.99);}
  button.valid{
    transform:scale(1.02);
  }
  .error{
    font-size:13px;
    color:var(--danger);
    background:var(--danger-soft);
    border-radius:8px;
    padding:9px 12px;
    display:none;
  }
  .error.show{display:block;}
  .site-footer{
    margin-top:22px;
    font-size:12px;
    color:var(--text-muted);
    opacity:0.6;
  }
  .site-footer a{color:inherit;}
</style>
</head>
<body>

<div class="card">
  <h1>G-check</h1>
  <p class="sub">Введите пароль для доступа</p>

  <form id="loginForm" autocomplete="off">
    <input type="password" id="passwordInput" placeholder="Пароль" autofocus>
    <div class="error" id="errorMsg">Неверный пароль</div>
    <div class="success" id="successMsg">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline class="checkmark" points="20 6 9 17 4 12"/></svg>
      Верно, входим...
    </div>
    <button type="submit" id="loginBtn">Войти</button>
  </form>

  <div class="site-footer">by <a href="https://t.me/hisamost" target="_blank" rel="noopener">hisamost</a></div>
</div>

<script>
  // SHA-256 хеш пароля. Это НЕ настоящая защита данных — только чтобы
  // случайный человек не открыл сайт по ссылке. Пароль виден любому,
  // кто откроет devtools и введёт правильную строку, зная хеш можно
  // подобрать пароль офлайн. Для реальной защиты данных нужен бекенд.
  const PASSWORD_HASH = "125cc01e3590742de6c2745c92ad4c2c1341c0a4346a118debb6b6f8415bb955";
  const SESSION_KEY = "gcheck_auth_time"; // timestamp входа
  const SESSION_TTL_MS = 12 * 60 * 60 * 1000; // 12 часов

  async function sha256(text){
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // Если уже авторизован и не прошло 12 часов — сразу на главную
  const savedTime = parseInt(localStorage.getItem(SESSION_KEY) || '0', 10);
  if(savedTime && (Date.now() - savedTime) < SESSION_TTL_MS){
    location.replace('index.html');
  }

  const form = document.getElementById('loginForm');
  const input = document.getElementById('passwordInput');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const loginBtn = document.getElementById('loginBtn');

  let unlocked = false;

  function proceed(){
    localStorage.setItem(SESSION_KEY, Date.now().toString());
    const params = new URLSearchParams(location.search);
    const redirect = params.get('redirect');
    location.replace(redirect ? decodeURIComponent(redirect) : 'index.html');
  }

  async function checkPassword(){
    if(unlocked) return;
    const value = input.value;
    if(!value) return;

    const hash = await sha256(value);
    if(hash === PASSWORD_HASH){
      unlocked = true;
      errorMsg.classList.remove('show');
      input.classList.add('valid');
      input.readOnly = true;
      loginBtn.classList.add('valid');
      successMsg.classList.add('show');
      setTimeout(proceed, 450);
    }
  }

  input.addEventListener('input', () => {
    errorMsg.classList.remove('show');
    checkPassword();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(unlocked) { proceed(); return; }

    const value = input.value;
    const hash = await sha256(value);

    if(hash === PASSWORD_HASH){
      checkPassword();
    } else {
      errorMsg.classList.add('show');
      input.value = '';
      input.focus();
    }
  });
</script>

</body>
</html>
